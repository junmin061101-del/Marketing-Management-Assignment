/* Step guides: each step = {t: title, d: detail, need: [checklist], link, tip} */
function visaGuide(h,p,stay=STAY[p.id]){
  const pg=pagesOf(h), long=stay>90, over6=stay>183, over180=stay>180, cc=h.cc;
  if(cc==='GB'){
    if(over6) return {title:'Apply for a UK Student visa',rule:'Courses over 6 months need a Student visa',links:[L('GOV.UK · Student visa','https://www.gov.uk/student-visa'),L('GOV.UK · Immigration Health Surcharge','https://www.gov.uk/healthcare-immigration-application'),L('GOV.UK · eVisa (UKVI account)','https://www.gov.uk/evisa')],steps:[
      {t:'Get your CAS number',d:'After you accept your offer, the host issues a Confirmation of Acceptance for Studies (CAS). You need this reference number for the application.',link:pg.intl},
      {t:'Apply online on GOV.UK',d:'You can apply up to 6 months before your course starts. Pay the visa fee and the Immigration Health Surcharge (IHS) shown during the application.',need:['Passport','CAS number','Proof of funds (if required)','TB test result (if required)'],link:L('GOV.UK · Student visa','https://www.gov.uk/student-visa')},
      {t:'Prove your identity',d:'Either scan your passport with the UK Immigration: ID Check app or give biometrics at a visa application centre. The application tells you which.'},
      {t:'Get your eVisa',d:'Decisions usually take about 3 weeks. Your visa is digital: create a UKVI account to view and share your eVisa.',link:L('GOV.UK · eVisa','https://www.gov.uk/evisa')}]};
    return {title:long?'Get a UK ETA (Standard Visitor)':'Get a UK ETA',rule:'Study of up to 6 months is allowed as a Standard Visitor. Korean citizens need an ETA instead of a visa',links:[L('GOV.UK · Electronic Travel Authorisation','https://www.gov.uk/guidance/apply-for-an-electronic-travel-authorisation-eta'),L('GOV.UK · Standard Visitor','https://www.gov.uk/standard-visitor')],steps:[
      {t:'Confirm you can study as a visitor',d:'Courses of up to 6 months at an accredited institution are allowed as a Standard Visitor. You cannot work during your stay.',link:L('GOV.UK · Standard Visitor','https://www.gov.uk/standard-visitor')},
      {t:'Apply for an ETA',d:'Apply through the UK ETA app or on GOV.UK with your passport and a photo, and pay the fee shown. Most decisions arrive within 3 working days.',link:L('GOV.UK · ETA','https://www.gov.uk/guidance/apply-for-an-electronic-travel-authorisation-eta')},
      {t:'Pack your border documents',d:'Carry these in your hand luggage in case the officer asks.',need:['Acceptance letter','Proof of funds','Return or onward ticket','Accommodation address']}]};
  }
  if(cc==='FR'&&long) return {title:'Apply for a French student visa (VLS-TS)',rule:'Stays over 90 days need a long-stay student visa, validated online after arrival',links:[L('France-Visas (official)','https://france-visas.gouv.fr/'),L('Campus France Korea','https://www.coree.campusfrance.org/'),L('ANEF · VLS-TS validation','https://administration-etrangers-en-france.interieur.gouv.fr/')],steps:[
    {t:'Check the Campus France step',d:'Korea is an “Études en France” country. Ask your host whether your exchange needs a Campus France file; if so, create an account and submit it first.',link:L('Campus France Korea','https://www.coree.campusfrance.org/')},
    {t:'Apply on France-Visas',d:'Fill out the long-stay student visa application online and book an appointment at the visa application centre in Seoul.',need:['Passport','Acceptance letter','Proof of funds','Proof of accommodation','Health insurance','ID photos'],link:L('France-Visas','https://france-visas.gouv.fr/')},
    {t:'Attend the appointment',d:'Submit your documents and fingerprints. The visa is printed in your passport.'},
    {t:'Validate your visa after arrival',d:'Within 3 months of arrival, validate your VLS-TS online on the ANEF website and pay the tax stamp. Without this you are not legally resident.',link:L('ANEF · VLS-TS validation','https://administration-etrangers-en-france.interieur.gouv.fr/')}]};
  if(cc==='DE'&&long) return {title:'Get your German residence permit',rule:'Korean citizens can enter visa-free and apply for a residence permit for study in Germany',links:[L('German Embassy Seoul','https://seoul.diplo.de/'),L('Make it in Germany','https://www.make-it-in-germany.com/en/')],steps:[
    {t:'Choose your route',d:'Korean citizens can enter visa-free and apply in Germany within 90 days, or apply for a national visa at the German Embassy in Seoul before leaving. Your host will say which it recommends.',link:L('German Embassy Seoul','https://seoul.diplo.de/')},
    {t:'Register your address (Anmeldung)',d:'Within 2 weeks of moving in, register at the local Bürgeramt and keep the registration certificate.',need:['Passport','Landlord confirmation (Wohnungsgeberbestätigung)']},
    {t:'Book the foreigners’ office (Ausländerbehörde)',d:'Book early, because appointments fill up. Bring everything on this list.',need:['Passport','Admission letter','Health insurance','Proof of funds (blocked account or scholarship letter)','Biometric photo','Registration certificate']},
    {t:'Collect your residence card',d:'Your electronic residence permit (eAT) is ready a few weeks later.'}]};
  if(cc==='NL'&&long) return {title:'Get your Dutch residence permit',rule:'The host applies to the IND for your residence permit; Korean citizens do not need an MVV entry visa',links:[L('IND · Residence permit for study','https://ind.nl/en/residence-permits/study')],steps:[
    {t:'Start the application in the host portal',d:'Your host is a recognised sponsor and applies to the IND for you. Upload your documents and pay the fee through the host.',need:['Passport copy','Proof of funds','Signed antecedents certificate'],link:pg.intl},
    {t:'Wait for IND approval',d:'You get an approval letter by email. Korean citizens travel with their passport. No MVV entry visa is needed.',link:L('IND · Study','https://ind.nl/en/residence-permits/study')},
    {t:'Collect your residence card',d:'After arrival, pick up your residence permit card at an IND desk by appointment.'},
    {t:'Register with the municipality',d:'Register your address to get a BSN (citizen service number). You need it for banking and healthcare.'}]};
  if(cc==='JP'){
    if(!long) return {title:'Check Japan entry requirements',rule:'Stays up to 90 days are visa-free for Korean citizens as a temporary visitor',links:[L('Ministry of Foreign Affairs of Japan · Visa','https://www.mofa.go.jp/j_info/visit/visa/')],steps:[
      {t:'Confirm visa-free entry',d:'Short programs under 90 days are visa-free for Korean passports. Check with your host if the program includes paid work or a long internship.'},
      {t:'Carry your documents',d:'Keep these in your hand luggage.',need:['Passport','Acceptance letter','Return ticket','Accommodation address']}]};
    return {title:'Get your COE and student visa',rule:'A Certificate of Eligibility (COE) comes first, then a College Student visa',links:[L('Immigration Services Agency of Japan','https://www.moj.go.jp/isa/'),L('Embassy of Japan in Korea','https://www.kr.emb-japan.go.jp/')],steps:[
      {t:'Send COE documents to the host',d:'Your host applies for your COE at the Immigration Services Agency in Japan. It takes about 1–3 months.',need:['Passport copy','Photo','Proof of funds'],link:pg.intl},
      {t:'Receive your COE',d:'Most hosts now send an electronic COE by email. Check that your name and dates are correct.'},
      {t:'Apply for the visa in Korea',d:'Apply at the Embassy of Japan in Seoul or a consulate (Busan, Jeju). It is usually issued in about 5 working days.',need:['Passport','Visa application form','Photo','COE'],link:L('Embassy of Japan in Korea','https://www.kr.emb-japan.go.jp/')},
      {t:'Get your residence card at the airport',d:'You receive your residence card on arrival at major airports such as Narita, Haneda and Kansai.'},
      {t:'Register your address',d:'Within 14 days of moving in, register at your city or ward office and join National Health Insurance.'}]};
  }
  if(cc==='CN') return {title:over180?'Apply for a Chinese X1 student visa':'Apply for a Chinese X2 visa',rule:'Study needs an X1 visa (over 180 days) or X2 visa (180 days or less)',links:[L('Chinese Visa Application Service Center','https://www.visaforchina.cn/')],steps:[
    {t:'Get your admission documents',d:'The host sends your Admission Notice and the JW202 form (Visa Application for Study in China).',link:pg.intl},
    {t:'Apply at the visa centre in Seoul',d:`Apply for an ${over180?'X1':'X2'} visa at the Chinese Visa Application Service Center.`,need:['Passport','Application form','Photo','Admission Notice','JW202 form'],link:L('Chinese Visa Application Service Center','https://www.visaforchina.cn/')},
    {t:'Register your accommodation',d:'Register with the local police within 24 hours of arrival. Dorms usually do this for you.'},
    ...(over180?[{t:'Get a residence permit',d:'X1 holders must apply at the local Public Security Bureau exit-entry office within 30 days of arrival.'}]:[])]};
  if(cc==='SG') return {title:"Apply for a Student's Pass",rule:"International students need a Student's Pass, applied through ICA's SOLAR system",links:[L("ICA · Student's Pass",'https://www.ica.gov.sg/reside/STP'),L("ICA · Apply for a Student's Pass",'https://www.ica.gov.sg/reside/STP/apply')],steps:[
    {t:'Get your SOLAR application number',d:'The host registers you in SOLAR and emails you the application number.',link:pg.exch},
    {t:'Submit eForm 16',d:"Fill out the Student's Pass application online and pay the processing fee.",link:L("ICA · Apply for a Student's Pass",'https://www.ica.gov.sg/reside/STP/apply')},
    {t:'Receive your In-Principle Approval (IPA)',d:'Print the IPA letter. You show it when you enter Singapore.'},
    {t:'Complete formalities at ICA',d:"After arrival, attend your ICA appointment to collect your Student's Pass card.",need:['Passport','IPA letter','Photo','Medical report (if requested)']}]};
  if(cc==='AU'){
    const ETA=L('Home Affairs · Electronic Travel Authority (subclass 601)','https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/electronic-travel-authority-601');
    const SV=L('Home Affairs · Student visa (subclass 500)','https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/student-500');
    if(stay<=92) return {title:'Get an Australian ETA',rule:'Korean passport holders can study for up to 3 months on an ETA (subclass 601)',links:[ETA],steps:[
      {t:'Check that a visitor visa fits',d:'An ETA lets you study for a total of up to 3 months. If study is the main reason for your trip and the course is longer, you need a Student visa instead.',link:ETA},
      {t:'Apply in the Australian ETA app',d:'Use your Korean passport and pay the AUD 20 service charge. Most results arrive the same day.'},
      {t:'Carry your documents',d:'Keep these in your hand luggage.',need:['Passport','Acceptance letter','Return ticket','Accommodation address','Travel insurance']}]};
    return {title:'Apply for an Australian Student visa (subclass 500)',rule:'Courses longer than 3 months need a Student visa and Overseas Student Health Cover (OSHC)',links:[SV,ETA],steps:[
      {t:'Get your Confirmation of Enrolment (CoE)',d:'Your host issues a CoE after you accept your offer. You need its code for the visa application.',link:pg.exch},
      {t:'Buy OSHC health insurance',d:'OSHC is required. It must start at least a week before your course and cover your whole stay, or the visa is refused.'},
      {t:'Apply online in ImmiAccount',d:'The application fee starts at AUD 2,500. You show you are a genuine student and have enough money for your stay.',need:['Passport','CoE','OSHC policy','Proof of funds','Genuine Student answers'],link:SV},
      {t:'Complete health checks and biometrics if asked',d:'Home Affairs tells you after you apply. Median processing is about a month, so apply as soon as you have your CoE.'}]};
  }
  if(cc==='HK') return {title:'Apply for a Hong Kong student visa',rule:'Your host acts as sponsor for a student visa (entry permit)',links:[L('Immigration Department · Study in Hong Kong','https://www.immd.gov.hk/eng/services/visas/study.html')],steps:[
    {t:'Fill out the forms',d:'Complete form ID995A (applicant). The host completes ID995B (sponsor) and submits both.',link:L('Immigration Department · Study','https://www.immd.gov.hk/eng/services/visas/study.html')},
    {t:'Pay and receive your e-Visa',d:'Pay the fee once approved, then download your e-Visa and keep it for travel.'},
    ...(over180?[{t:'Apply for a Hong Kong ID card',d:'If you stay over 180 days, apply for an HKID within 30 days of arrival.'}]:[])]};
  if(cc==='TW') return {title:long?'Apply for a Taiwan resident visa':'Check Taiwan entry requirements',rule:'Visa-free up to 90 days; longer study needs a visa from the Taipei Mission in Korea',links:[L('Taipei Mission in Korea','https://www.roc-taiwan.org/kr_en/'),L('Bureau of Consular Affairs','https://www.boca.gov.tw/mp-2.html')],steps:long?[
    {t:'Apply at the Taipei Mission in Korea',d:'Apply for a resident or visitor visa for study, depending on your program length.',need:['Passport','Application form','Photo','Admission letter','Health certificate (if requested)'],link:L('Taipei Mission in Korea','https://www.roc-taiwan.org/kr_en/')},
    {t:'Get your ARC',d:'Resident visa holders apply for an Alien Resident Certificate (ARC) within 15 days of arrival.'}]:[
    {t:'Confirm visa-free entry',d:'Programs under 90 days are visa-free for Korean passports.'},
    {t:'Carry your documents',d:'Keep these in your hand luggage.',need:['Passport','Acceptance letter','Return ticket']}]};
  if(SCHENGEN.has(cc)&&!long) return {title:'Check Schengen entry requirements',rule:'Korean passports get 90 days in any 180 visa-free in the Schengen area',links:EU_TRAVEL,steps:[
    {t:'Count your days',d:'Short programs fit within 90 days in any 180-day period. Earlier trips to Europe in the same window count too.'},
    {t:'Expect EES registration',d:'The Entry/Exit System records your fingerprints and photo at your first entry.',link:EU_TRAVEL[0]},
    {t:'Check ETIAS before you fly',d:'ETIAS travel authorisation is due to start in late 2026. Check whether it applies on your travel date.',link:EU_TRAVEL[1]},
    {t:'Carry your documents',d:'Keep these in your hand luggage.',need:['Passport','Acceptance letter','Proof of funds','Return ticket','Travel insurance']}]};
  const R=RULES[cc]||(SCHENGEN.has(cc)?{rule:'Stays over 90 days need a national long-stay visa or residence permit',links:[SAFE]}:{rule:`Check the student visa rules on the ${h.country} embassy website`,links:[SAFE]});
  return {title:long?'Apply for a student visa or residence permit':'Check visa and entry requirements',rule:R.rule,links:R.links,steps:[
    {t:'Read the host’s visa guidance',d:'International offices usually publish step-by-step visa instructions for their incoming students.',link:pg.intl},
    {t:'Check the official rules',d:R.rule+'.',link:R.links[0]},
    {t:'Gather your documents',d:'Most student visa applications ask for the same core set.',need:['Passport (valid beyond your stay)','Admission letter','Proof of funds','Health insurance','ID photos','Proof of accommodation']},
    {t:'Apply and book any appointment',d:'Submit online or at the embassy in Seoul. Processing can take several weeks, so apply as soon as your admission letter arrives.'},
    {t:'Register after arrival',d:'Many countries ask you to register your address or collect a residence card within days of arriving. Check the deadline.'}]};
}

function englishOf(h,p){
  const E=ENGLISH[h.name]; const key=p.long?'ex':'ss';
  if(E&&E[key]) return {...E[key],verified:true,check:STATUS&&STATUS.english[h.name+'|'+key]};
  const dom=domainOf(h.url);
  return {verified:false,t:[],scope:'Not confirmed yet',note:`We have not confirmed ${h.short}’s official English requirement yet. Accepted tests differ by university (TOEFL, IELTS, Cambridge, CEFR level, TOEIC and others), so check the official page before you book a test.`,
    src:(()=>{const P=HOST_PAGES[h.name]||{},u=P.exch||P.intl;return u?{label:`${h.short} · International office`,url:u,verified:true}:{label:`${h.short} · Official website`,url:h.url||'',verified:true}})()};
}
const engLine=e=>{if(e.none) return 'English test not required'; if(!e.t.length) return 'Not confirmed yet'; const sc=e.t.filter(x=>/\d/.test(x[1])); return (sc.length?sc:e.t).slice(0,3).map(x=>`${x[0].replace(' iBT','')} ${x[1]}`).join(' · ')};  // scores first; "Accepted"-type rows only when there is no score
function engPill(e){
  if(!e.verified) return `<span class="pill cat">Not verified</span>`;
  const c=e.check&&e.check.s, d=checkedDay();
  if(c==='changed') return `<span class="pill cat">Source changed. Re-checking</span>`;
  if(c==='ok'&&d) return `<span class="pill ok">Checked ${fmtShort(d)}</span>`;
  return `<span class="pill ok">Verified Oct 2026</span>`;
}
function engCard(e){return `<div class="eng${e.verified?'':' est'}"><div class="eng-top"><b>${e.verified?'Minimum scores':'Official requirement not confirmed'}</b>${engPill(e)}</div>
  ${e.t.length?'':''}<div class="eng-grid">${e.t.map(x=>{const w=String(x[1]).length>6||String(x[0]).length>16;return `<div${w?' class="wide"':''}><small>${x[0]}</small><b class="num">${x[1]}</b>${x[2]?`<em>${x[2]}</em>`:''}</div>`}).join('')}</div>
  <p>${e.t.length?esc(e.scope)+'. ':''}${esc(e.note)}${e.check&&e.check.s==='changed'?' <b>The official page no longer shows these exact numbers. Confirm there before you book a test.</b>':''}</p>${linkHTML(lk(e.src),true)}</div>`}

const KDCA=L('KDCA Immunization Helper · English certificate (예방접종도우미)','https://nip.kdca.go.kr/irhp/mngm/goVcntMngm.do?menuLv=3&menuCd=341');
const GOV24=L('Gov24 · Vaccination certificate (정부24)','https://www.gov.kr/mw/AA020InfoCappView.do?CappBizCD=14600000398');
function healthGuide(h,p,stay=STAY[p.id]){
  const pg=pagesOf(h), cc=h.cc;
  const cert={t:'Get your English vaccination certificate',d:'Print it free online from KDCA’s Immunization Helper or Gov24. It lists every shot recorded in Korea’s national registry. Childhood records from before the 2000s can be incomplete, so check it carefully.',link:KDCA};
  const check={t:'Check what your host asks for',d:'The student health center lists required vaccines, deadlines and any form you must use.',link:pg.health};
  const clinic={t:'Fill any gaps at a clinic',d:'Visit a hospital international clinic (국제진료센터) or travel clinic for missing doses, or a blood titer test that proves immunity. Some vaccines need doses 4+ weeks apart, so start early.'};
  const pack={t:'Pack a copy',d:'Keep the English certificate in your carry-on and a scan on your phone. Dorms and clinics abroad sometimes ask for it.'};
  if(h.region==='us') return {title:'Submit immunization records',
    sum:`Most U.S. universities require proof of vaccinations before you can register, and many ask international students for a TB screening. Missing records usually put a hold on your registration${p.long?'':' or program check-in'}.`,
    rows:[['MMR','2 doses (measles, mumps, rubella)'],['Meningococcal','MenACWY, often required for students in housing'],['Tdap','Within the last 10 years'],['TB','Screening form; blood test (IGRA) if required'],['Sometimes','Varicella, Hepatitis B, COVID-19']],
    steps:[check,cert,{...clinic,need:['MMR ×2','MenACWY','Tdap','Varicella (if no history)','Hepatitis B (some schools)']},
      {t:'Take a TB test if required',d:'Many schools ask students from Korea for an IGRA blood test (or skin test). A positive result needs a chest X-ray. Results usually must be recent, so check the time window.'},
      {t:'Have a doctor sign the host’s form',d:'Many schools use their own immunization form, completed and signed by a doctor in English.'},
      {t:'Upload to the student health portal',d:'Upload everything before the deadline to avoid a registration hold.',link:pg.health}],
    links:[lk(pg.health),lk(KDCA),lk(GOV24)]};
  if(h.cc==='CA') return {title:'Check immunization requirements',
    sum:'Canada does not require vaccines for entry, but some universities and residences ask for immunization records, especially for health-related programs.',
    rows:[['Entry','No vaccine requirement'],['Often asked','MMR, MenACWY (residence), Tdap'],['Health programs','Hepatitis B, TB test']],
    steps:[check,cert,clinic,pack],links:[lk(pg.health),lk(KDCA),lk(GOV24)]};
  if(cc==='GB') return {title:'Get recommended vaccinations',
    sum:'The NHS recommends MenACWY and MMR vaccines before starting university, because meningitis and measles spread easily in student housing.',
    rows:[['Entry','No vaccine requirement'],['Recommended','MenACWY, MMR ×2']],
    steps:[{t:'Check the NHS recommendations',d:'Read why students are advised to have MenACWY and MMR.',link:L('NHS · MenACWY vaccine','https://www.nhs.uk/vaccinations/menacwy-vaccine/')},cert,clinic,pack],
    links:[lk(L('NHS · MenACWY vaccine','https://www.nhs.uk/vaccinations/menacwy-vaccine/')),lk(L('NHS · MMR vaccine','https://www.nhs.uk/vaccinations/mmr-vaccine/')),lk(KDCA)]};
  if(cc==='CN'&&stay>180) return {title:'Complete your physical examination',
    sum:'X1 visa holders need a Foreigner Physical Examination Record for the residence permit. Many students do the check at the local International Travel Healthcare Center after arrival.',
    rows:[['Who','X1 visa (over 180 days)'],['Includes','Blood test, chest X-ray, ECG'],['When','Before applying for the residence permit']],
    steps:[{t:'Ask the host which option to use',d:'Some hosts accept an exam done in Korea on the official form; others send you to a local center after arrival.',link:pg.intl},cert,pack],links:[lk(pg.intl),lk(KDCA)]};
  if(cc==='TW'&&stay>90) return {title:'Get a health certificate',
    sum:'Resident visa applicants for Taiwan submit a health certificate from an approved hospital, including a chest X-ray and proof of measles and rubella immunity.',
    rows:[['Who','Resident visa applicants'],['Includes','Chest X-ray, measles & rubella immunity'],['Where','Approved hospital in Korea']],
    steps:[{t:'Check the form with the Taipei Mission',d:'Download the current health certificate form and list of approved hospitals.',link:L('Taipei Mission in Korea','https://www.roc-taiwan.org/kr_en/')},cert,clinic],links:[lk(L('Taipei Mission in Korea','https://www.roc-taiwan.org/kr_en/')),lk(KDCA)]};
  if(cc==='SG') return {title:'Prepare a medical report if asked',
    sum:"ICA may ask Student's Pass applicants for a medical examination report. Your IPA letter says whether you need one.",
    rows:[['Who','Only if stated in your IPA letter'],['Includes','Chest X-ray, HIV test (if requested)']],
    steps:[{t:'Read your IPA letter',d:'It lists any medical report you must bring to ICA.',link:L("ICA · Student's Pass",'https://www.ica.gov.sg/reside/STP')},cert,pack],links:[lk(L("ICA · Student's Pass",'https://www.ica.gov.sg/reside/STP')),lk(KDCA)]};
  return {title:'Check immunization requirements',
    sum:`${h.country} has no vaccine requirement for Korean students entering the country, but some universities and dorms ask for records, especially for lab or health courses.${cc==='NL'?' Korean citizens are exempt from the Dutch TB test.':''}`,
    rows:[['Entry','No vaccine requirement'],['Sometimes asked','MMR, Hepatitis B, TB screening']].concat(cc==='NL'?[['TB test (IND)','Exempt for Korean citizens']]:[]),
    steps:[check,cert,pack],links:[lk(pg.health),lk(KDCA),lk(GOV24)]};
}

  add({id:'ins',cat:'Living',title:'Buy insurance or request a waiver',off:long?20:14,
    sum:'Most hosts require international students to have health insurance, and many enroll you in their own plan automatically. Check whether you can waive it with an outside plan.',

  // With a host-specific flow, prerequisites must come before the step that needs them:
  // English scores and the course list before the application, proof of funds before the visa document request.
  if(FLOW.length){
    const g=id=>it.find(x=>x.id===id), app=g('app')||it.filter(x=>x.cat==='Apply').sort((a,b)=>b.off-a.off)[0], fin=g('fin');
    if(app){ const e=g('eng'); if(e&&!e.flow) e.off=Math.max(e.off,app.off+4); const c=g('pickc'); if(c&&!c.flow) c.off=Math.max(c.off,app.off+2); }
    if(fin){ const f=g('funds'); if(f&&!f.flow) f.off=Math.max(f.off,fin.off+4); }

  return it;

const uniKo=n=>LANG==='ko'?(krKo(n)||n):n;
const majorTxt=x=>LANG==='ko'?(KO[x]||x):x;
const majorNorm=x=>String(x||'').trim().toLowerCase().replace(/\s*(학과|학부|전공)$/,'');
const sameSchool=m=>!!S.profile.univ&&homeKo(m.home)===homeKo(S.profile.univ);
const sameMajor=m=>{const p=majorNorm(S.profile.major); return !!p&&[m.major,KO[m.major]].some(x=>x&&majorNorm(x)===p)};
const mScore=m=>(sameSchool(m)?2:0)+(sameMajor(m)?1:0);
const mSchool=m=>LANG==='ko'?`${uniKo(m.home)} ${majorTxt(m.major)}`:`${m.home} · ${m.major}`;
const matchPills=m=>(sameSchool(m)?'<span class="pill ok">Same school</span>':'')+(sameMajor(m)?'<span class="pill ok">Same major</span>':'');
const reviewsOf=m=>[...((S.reviews[m.key]||{}).list||[]),...(SAMPLE_REVIEWS[m.key]||[])];

function schoolListHTML(){
  if(!DATA) return '<p class="loadmsg">Loading universities…</p>';
  if(DATA.error) return '<p class="loadmsg">Couldn’t load the university list. Check your connection and reload.</p>';
  const q=S.sq.trim().toLowerCase();
  let list=regionHosts();
  if(S.scountry!=='All') list=list.filter(u=>u[1]===S.scountry);
  const row=u=>{const h=makeHost(u);const on=S.pick&&S.pick.name===u[0]&&S.pick.cc===u[1];
    return `<button class="srow${on?' on':''}" data-act="pick" data-v="${esc(u[0])}" data-cc="${u[1]}"><span class="mono">${esc(h.mono)}</span><span class="t"><b>${hi(u[0],S.sq.trim())}</b><small>${esc(h.country)}</small></span>${on?'<span class="ok">'+ic('check',20,2.6)+'</span>':''}</button>`};
  if(q){
    const pool=S.scountry==='All'?DATA.unis:list;   // a typed search covers every region
    const cq=squash(q);
    const m=pool.filter(u=>uniHit(u[0],u[3],q)||squash(COUNTRIES[u[1]][0]).includes(cq)||squash(NAME_KO[COUNTRIES[u[1]][0]]).includes(cq)).map(u=>[uniRank(u[0],u[3],q),u]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    return `<p class="sect-label">Results<span class="num">${m.length.toLocaleString()}</span></p>${m.length?m.slice(0,S.slimit).map(row).join(''):'<p class="loadmsg">No universities match. Try another spelling or region.</p>'}${m.length>S.slimit?'<button class="more" data-act="more">Show more</button>':''}`;
  }
  let out='';
  out+=`<p class="sect-label">All universities<span class="num">${list.length.toLocaleString()}</span></p>${list.slice(0,S.slimit).map(row).join('')}${list.length>S.slimit?'<button class="more" data-act="more">Show more</button>':''}`;
  return out;
}
/* Korean universities and their departments (data/kr-majors.json, built from the Ministry of Education's
   대학알리미 file by scripts/build-kr-majors.mjs). Home universities are always shown and stored in Korean. */
const KRM={list:null,loading:null,year:0};
function loadKRM(){ if(KRM.list) return Promise.resolve(); if(KRM.loading) return KRM.loading;
  KRM.loading=fetch(BASE+'/data/kr-majors.json').then(r=>r.json()).then(j=>{KRM.list=j.schools; KRM.year=j.year; fixHome();
    if(S.screen==='profile') render(true); else if(S.screen==='app'&&S.tab==='me') render(true)}).catch(()=>{KRM.loading=null}); return KRM.loading }
// "Sungkyunkwan University" (older profiles, sample mentors) → "성균관대학교"
const homeKo=v=>{ if(!v||/[가-힣]/.test(v)) return v||''; const s=KRM.list&&KRM.list.find(x=>x[2]===v); return s?s[0]:(krKo(v)||v) };
const krmOf=name=>KRM.list&&KRM.list.find(x=>x[0]===name);
function fixHome(){ const v=S.profile.univ; if(!v||/[가-힣]/.test(v)) return; const k=homeKo(v); if(k===v) return; S.profile.univ=k;
  if(AUTH.user) api('me',{profile:{home:k,major:S.profile.major,year:S.profile.year}}).then(j=>{AUTH.user=j.user}).catch(()=>{}) }
function homeListHTML(){
  if(!KRM.list){ loadKRM(); return `<div class="sugg"><p class="empty" data-notr>${KX('Loading universities…','대학 목록을 불러오는 중…')}</p></div>` }
  const q=S.homeQ.trim(); if(!q) return '';
  const qs=squash(q), hit=u=>squash(u[0]).includes(qs)||squash(u[2]).includes(qs)||squash(ALIAS[u[2]]).includes(qs);
  const m=KRM.list.filter(hit).map(u=>[squash(u[0]).startsWith(qs)?0:1,u]).sort((a,b)=>a[0]-b[0]||a[1][0].length-b[1][0].length).map(x=>x[1]).slice(0,8);
  return `<div class="sugg">${m.length?m.map(u=>`<button data-act="pickHome" data-v="${esc(u[0])}">${ic('school',18)}<span class="hn" data-notr><b>${esc(u[0])}</b><small>${esc(u[1])}</small></span></button>`).join('')
    :`<p class="empty" data-notr>${KX('No match. Try another spelling.','찾는 대학이 없어요. 다른 이름으로 검색해 보세요.')}</p>`}</div>`;
}

// center-crop to a square and shrink to 320 px JPEG (~20–40 KB)
function squareJPEG(file){return new Promise((ok,no)=>{const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{const n=Math.min(img.naturalWidth,img.naturalHeight); if(!n) return no(new Error('bad'));
    const c=document.createElement('canvas'); c.width=c.height=320; const g=c.getContext('2d');
    g.drawImage(img,(img.naturalWidth-n)/2,(img.naturalHeight-n)/2,n,n,0,0,320,320); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',0.85))};
  img.onerror=()=>{URL.revokeObjectURL(url); no(new Error('bad'))}; img.src=url})}
document.addEventListener('change',e=>{ if(e.target.id!=='avaFile'||!e.target.files||!e.target.files[0]) return;
  const f=e.target.files[0]; e.target.value='';
  if(!/^image\/jpe?g$/.test(f.type)&&!/\.jpe?g$/i.test(f.name)) return openAvaSheet(trText('Only JPEG (.jpg) photos can be used.'));
  if(f.size>10*1024*1024) return openAvaSheet(trText('This photo is too large. Choose one under 10 MB.'));
  toast(LANG==='ko'?'사진을 올리는 중…':'Uploading…');
  squareJPEG(f).then(image=>api('avatar',{image})).then(j=>{AUTH.user=j.user; closeSheet(); render(true); toast('Profile photo updated')})
    .catch(err=>openAvaSheet(trText(err.code==='file_too_large'||err.code==='bad_image_size'?'This photo could not be resized. Try another one.':err.code==='jpeg_only'||err.message==='bad'?'This file could not be read. Choose a JPEG (.jpg) photo.':errMsg(err)))) });

/* Every screen change is a browser history entry, so the back arrow, the browser's back button
   and a left-to-right swipe all return to the page the student was actually on. */
const NAVK=['screen','tab','detail','room','cv','doc'];
const NAV={key:'',d:0,pop:false,prev:'',floor:null,sid:Math.random().toString(36).slice(2)}; const KEEP={};
/* Once the student reaches the app, home is the floor: back never returns to the setup screens
   (start, login, school, program), so a finished setup can't be undone by pressing back. */
const SETUP=new Set(['boot','splash','lang','login','profile','school','program','building']);
const atFloor=()=>NAV.floor!==null&&NAV.d<=NAV.floor;
const PARENT={detail:{screen:'app'},chat:{screen:'app',tab:'chat'},mentorApply:{screen:'app',tab:'me'},doc:{screen:'app',tab:'me'},program:{screen:'school'},school:{screen:'profile'},profile:{screen:'login'},login:{screen:'splash'}};
const parentOf=()=>PARENT[S.screen]||(S.screen==='app'&&S.tab!=='home'?{screen:'app',tab:'home'}:null);
const canBack=()=>!!parentOf()||NAV.d>0&&!atFloor();
function navSync(){
  const snap={}; NAVK.forEach(k=>snap[k]=S[k]===undefined?null:S[k]);
  const key=JSON.stringify(snap); if(key===NAV.key) return false;
  let kind='push';
  if(NAV.pop){NAV.pop=false; kind='pop'}
  else if(!NAV.key||NAV.replaceNext||NAV.prev==='building'||NAV.prev==='boot'||NAV.prev==='lang'&&S.screen==='splash'){ NAV.replaceNext=false; history.replaceState({gg:snap,d:NAV.d,sid:NAV.sid},'') }
  else { KEEP[NAV.key]=formSnap(); NAV.d++; history.pushState({gg:snap,d:NAV.d,sid:NAV.sid},'') }
  // arriving in the app from setup (first time, after a program change, after editing the profile) raises the floor
  if(S.screen==='app'&&(NAV.floor===null||SETUP.has(NAV.prev))) NAV.floor=NAV.d;
  NAV.key=key; NAV.prev=S.screen; return kind;
}
function navBack(){
  if($('#sheet').classList.contains('on')){closeSheet(); return}
  if(NAV.d>0&&!atFloor()){history.back(); return}
  const p=parentOf(); if(p){Object.assign(S,p); if(S.screen!=='detail') S.detail=null; render()}
}
addEventListener('popstate',e=>{const st=e.state&&e.state.gg; if(!st) return;
  // trying to step back below home into setup (or into a setup page from an earlier visit): stay on home
  if(NAV.floor!==null&&SETUP.has(st.screen)&&(e.state.sid!==NAV.sid||(e.state.d||0)<NAV.floor)){
    closeSheet(); Object.assign(S,{screen:'app',tab:'home',detail:null}); NAV.d=NAV.floor;
    const snap={}; NAVK.forEach(k=>snap[k]=S[k]===undefined?null:S[k]);
    history.pushState({gg:snap,d:NAV.d,sid:NAV.sid},''); NAV.key=JSON.stringify(snap); NAV.prev='app'; render(); return}
  // a page left over from before a reload: stay where we are
  if(e.state.sid!==NAV.sid){ const snap={}; NAVK.forEach(k=>snap[k]=S[k]===undefined?null:S[k]); history.pushState({gg:snap,d:NAV.d,sid:NAV.sid},''); return}
  closeSheet(); NAV.d=e.state.d||0; Object.assign(S,st);
  if(S.screen==='detail'&&!items().some(i=>i.id===S.detail)) S.screen='app';
  NAV.pop=true; render()});

  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]'); if(!a||a.dataset.doc) return;
    const href=a.getAttribute('href'); if(!/^https?:/i.test(href)) return; e.preventDefault(); const B=PLUG('Browser'); B?B.open({url:href}):window.open(href,'_blank')},true);

// swipe from left to right anywhere on a page to go back
(()=>{const box=view.parentElement; let g=null;
  const hScroll=t=>{for(let e=t;e&&e!==box;e=e.parentElement){if(e.scrollWidth>e.clientWidth+2&&/(auto|scroll)/.test(getComputedStyle(e).overflowX)) return true} return false};
  const target=()=>$('#sheet').classList.contains('on')?$('#sheet'):view;
  const reset=el=>{el.style.transition='transform .2s ease'; el.style.transform=''; setTimeout(()=>{el.style.transition=''},220)};
  box.addEventListener('pointerdown',e=>{
    if(!e.isPrimary||e.button>0||e.target.closest('input,textarea,select,[contenteditable],.tabbar')||hScroll(e.target)) return;
    if(!canBack()&&!$('#sheet').classList.contains('on')) return;
    g={x:e.clientX,y:e.clientY,drag:false,el:target()}});
  box.addEventListener('pointermove',e=>{ if(!g) return; const dx=e.clientX-g.x, dy=e.clientY-g.y;
    if(!g.drag){ if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){g=null; return} if(dx>14&&dx>Math.abs(dy)*1.5){ if(e.pointerType==='mouse'&&String(getSelection())) {g=null;return} g.drag=true } }
    if(g&&g.drag){ g.el.style.transform=`translateX(${Math.max(0,dx)*.6}px)` } });
  const end=e=>{ if(!g) return; const G=g; g=null; if(!G.drag) return; const dx=e.clientX-G.x; reset(G.el);
    // the drag must not also click the card it started on
    const stop=ev=>{ev.stopPropagation(); ev.preventDefault()}; addEventListener('click',stop,{capture:true,once:true}); setTimeout(()=>removeEventListener('click',stop,{capture:true}),50);
    if(e.type==='pointerup'&&dx>70) navBack() };
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);
})();

      if(!q){err.textContent=KX('Write the question.','질문을 적어 주세요.'); break} if(opts.length<2||new Set(opts).size!==opts.length){err.textContent=KX('Add at least two different options.','서로 다른 항목을 2개 이상 적어 주세요.'); break}
      closeSheet(); chatAction({action:'poll',q,opts,multi:!!($('#pollMulti')||{}).checked}).then(()=>paintRoom(S.room,true)); break}
    case 'pollVote': {const [id,i]=v.split(':'), p=((ROOMS[S.room]||{}).polls||{})[id]; if(!p||p.closed) break; const k=+i;
      const choice=p.multi?(p.mine.includes(k)?p.mine.filter(x=>x!==k):[...p.mine,k]):(p.mine.includes(k)?[]:[k]);
      chatAction({action:'vote',id,choice}); break}
    case 'pollClose': if(confirm(KX('Close this poll? Nobody can vote after that.','투표를 마감할까요? 마감 후에는 투표할 수 없어요.'))) chatAction({action:'closePoll',id:v}); break;
    case 'noticeEdit': openNoticeSheet(); break;
    case 'noticeOpen': openNoticeSheet(); break;
    case 'noticeSave': {const t=($('#noticeText')||{}).value.trim(); if(!t){$('#noticeText').focus(); break} closeSheet(); chatAction({action:'notice',text:t}); break}
    case 'noticeClear': closeSheet(); chatAction({action:'notice',text:''}); break;
    case 'openMedia': openUrl(v); break;
    case 'mentor': openMentorSheet(+v); break;
    case 'rmentor': openRealMentor(v); break;
    case 'rqOpen': openReqSheet(v); break;
    case 'rqSend': sendReq(v); break;
    case 'ss': {const i=v.indexOf(':'); sessAct(v.slice(0,i),v.slice(i+1)); break}
    case 'srvStar': {S.srv.rating=+v; $('#sheet').querySelectorAll('.rvstars button').forEach((b,k)=>b.classList.toggle('on',k<+v)); break}
    case 'srvSend': {const t=$('#srvText'), err=$('#srvErr'), text=t?t.value.trim():'';
      if(!S.srv.rating){err.textContent=trText(ERR.bad_rating); break} if(text.length<10){err.textContent=trText(ERR.review_too_short); break}
      api('reviews',{m:v,rating:S.srv.rating,text}).then(()=>{delete S.reviews[v]; closeSheet(); toast(KX('Thanks for the review','후기를 남겼어요'))}).catch(e=>{err.textContent=trText(errMsg(e))}); break}
    case 'srpSend': {const t=$('#srpText'), err=$('#srpErr'), text=t?t.value.trim():'';
      if(!text){err.textContent=trText(ERR.report_empty); break}
      api('sessions',{action:'report',id:v,text}).then(()=>{closeSheet(); toast(KX('Report sent. We will check it.','신고가 접수됐어요. 확인 후 연락드릴게요.'))}).catch(e=>{err.textContent=trText(errMsg(e))}); break}
    case 'rmentorChat': { if(!AUTH.user){closeSheet(); toast('Log in to use chat'); break} api('chat',{action:'open',mentor:v}).then(j=>{DMS.at=0; openRoom(j.room)}).catch(e=>toast(errMsg(e))); break}
    case 'closeSheet': closeSheet(); break;
    case 'editDep': openDepSheet(); break;
    case 'setLang': setLang(v); render(true); break;
    case 'openLang': openLangSheet(); break;
    case 'pickLang': {const was=LANG; closeSheet(); if(v!==was){ setLang(v); render(true); toast(LANG==='ko'?'언어를 한국어로 바꿨어요':'Language changed to English') } break}
    case 'saveDep': {const v2=$('#depSheetInput').value, r2=$('#retSheetInput').value;
      if(!v2||v2<MIN_DEP){toast('Pick a departure at least 2 weeks from today');return}
      if(!r2||r2<=v2){toast('Return date must be after departure');return}
      const before=items().map(i=>i.title).join();
      S.depOverride=v2===depOf(prog(),host())?null:v2; S.retOverride=r2===iso(addDays(D(v2),STAY[S.progId]))?null:r2;
      closeSheet(); savePlan(); render(true);
      toast(items().map(i=>i.title).join()!==before?`Stay: ${stayShort(stayDays())}. Visa steps updated`:`Stay: ${stayShort(stayDays())}. Deadlines updated`); break}
    case 'resetDep': S.depOverride=null; S.retOverride=null; savePlan(); closeSheet(); render(true); toast('Using the suggested travel dates'); break;
    case 'bcat': S.bcat=S.bcat===v?'All':v; render(true); break;
    case 'changeProg': S.pick=host(); S.region=regGroup(host().region); go('school'); break;
    case 'pwSheet': openPwSheet(); break;
    case 'delSheet': openDelSheet(); break;
    case 'avaSheet': openAvaSheet(); break;
    case 'avaRemove': api('avatar',{remove:true}).then(j=>{AUTH.user=j.user; closeSheet(); render(true); toast('Profile photo removed')}).catch(e=>openAvaSheet(trText(errMsg(e)))); break;
    case 'delAccount': {const pw=$('#delPw').value; if(!pw){openDelSheet(trText('Enter your password.'));break}
      api('auth/delete',{password:pw}).then(()=>{notifyDisable(); TOKEN.set(''); AUTH.user=null; hintIn(false); try{localStorage.removeItem('gg_profile')}catch(e){} closeSheet(); NAV.floor=null; S.screen='splash'; render(); toast('Your account was deleted')})
        .catch(e=>openDelSheet(trText(e.code==='wrong_password'?'The password is not right.':errMsg(e)))); break}
    case 'shareApp': shareApp(); break;
    case 'noteOn': closeSheet(); notifyEnable().then(ok=>{toast(ok?'Notifications are on':'Notifications are blocked. Turn them on in your phone settings.'); render(true)}); break;
    case 'noteLater': NOTE.set(false); closeSheet(); break;
    case 'noteToggle': if(NOTE.on()){ notifyDisable().then(()=>{toast('Notifications are off'); render(true)}) } else { notifyEnable().then(ok=>{toast(ok?'Notifications are on':'Notifications are blocked. Turn them on in your phone settings.'); render(true)}) } break;
    case 'pwSave': {const cur=$('#pwCur').value, nx=$('#pwNew').value; api('auth/password',{current:cur,next:nx}).then(()=>{closeSheet(); toast('Password changed')}).catch(e=>openPwSheet(trText(errMsg(e)))); break}
    case 'editProfile': S.editProfile=true; S.homeQ=''; go('profile'); break;
    case 'saveProfile': {S.editProfile=false; const P=S.profile; P.major=String(P.major||'').trim();
      if(AUTH.user) api('me',{profile:{home:P.univ,major:P.major,year:P.year}}).then(j=>{AUTH.user=j.user}).catch(()=>toast('Could not reach the server. Check your connection.'));
      try{localStorage.setItem('gg_profile',JSON.stringify({univ:P.univ,major:P.major,year:P.year}))}catch(e){}
      toast('Saved'); S.screen='app'; S.tab='me'; render(); break}
    case 'authMode': S.auth={...S.auth,mode:v,busy:false,err:''}; render(); break;
    case 'authLogin': authRun(async F=>{S.auth.id=String(F.auId||'').trim(); const j=await api('auth/login',{username:S.auth.id,password:F.auPw||''}); signedIn(j.user)}); break;
    case 'authSignup': authRun(async F=>{S.auth.id=String(F.auId||'').trim(); S.auth.name=String(F.auName||''); const j=await api('auth/signup',{username:S.auth.id,password:F.auPw||'',name:S.auth.name,agree:!!F.auAgree}); signedIn(j.user)}); break;
    case 'logout': (NOTE.token?api('me',{push:{remove:NOTE.token}}).catch(()=>{}):Promise.resolve()).then(()=>{NOTE.token=''; return api('auth/logout',{})}).catch(()=>{}).then(()=>{TOKEN.set(''); AUTH.user=null; hintIn(false); S.auth={mode:'login',id:'',name:'',busy:false,err:''}; render(); toast('Logged out')}); break;
    case 'apSend': apRun(async F=>{const em=F.apEmail; if(em!==undefined) S.apply.email=String(em).trim(); await api('mentor/uni-code',{uniEmail:S.apply.email}); S.apply.sent=true; toast('We sent a code to your university email')}); break;
    case 'apVerify': apRun(async F=>{const j=await api('mentor/uni-verify',{code:String(F.apCode||'').trim()}); AUTH.user=j.user; S.apply.sent=false; toast('University email verified')}); break;
    case 'apUpload': apRun(async()=>{const f=S.apply.fileObj; if(!f) return; if(f.size>3*1024*1024) throw {code:'file_too_large'};
      const data=await new Promise((ok,no)=>{const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=no; r.readAsDataURL(f)});
      const j=await api('mentor/apply',{file:{name:f.name,data}}); AUTH.user=j.user; S.apply.file=''; S.apply.fileObj=null; toast('Submitted. The review takes up to 24 hours')}); break;
    case 'apRefresh': apRun(async()=>{await loadMe(); toast(mStat()==='approved'?'Review approved':'Still in review')}); break;
    case 'apDraft': case 'apPublish': apRun(async F=>{const pf=mentorForm(F); if(act==='apPublish'&&(!pf.offer||!pf.home||!pf.major)){throw {code:'profile_incomplete'}}
      S.apply.form=pf; try{localStorage.setItem('gg_mentor_draft',JSON.stringify(pf))}catch(e){}
      const j=await api('mentor/profile',{action:act==='apPublish'?'publish':'draft',profile:pf}); AUTH.user=j.user; toast(act==='apPublish'?'Your profile is live':'Draft saved')},'form'); break
  }
});
document.addEventListener('focusin',e=>{ const id=e.target&&e.target.id; if(S.screen!=='profile') return;
  if(id==='major'&&!S.majorOpen){S.majorOpen=true; const l=$('#majorList'); if(l) l.innerHTML=majorListHTML()}
  else if(id&&id!=='major'&&S.majorOpen){S.majorOpen=false; const l=$('#majorList'); if(l) l.innerHTML=''} });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.model) S.profile[t.dataset.model]=t.value;
  if(t.id==='major'){S.majorOpen=true; const l=$('#majorList'); if(l) l.innerHTML=majorListHTML(); const b=$('[data-act="saveProfile"]'); if(b) b.disabled=!(S.profile.univ&&t.value.trim())}
  if(t.id==='homeQ'){S.homeQ=t.value; ($('#homeList').innerHTML=homeListHTML(),translate($('#homeList')))}
  if(t.id==='cQ'){S.cq=t.value; const b=$('#cBody'); if(b){b.innerHTML=cBodyHTML(); translate(b)}}
  if(t.id==='schoolQ'){S.sq=t.value; S.slimit=40; ($('#schoolList').innerHTML=schoolListHTML(),translate($('#schoolList')))}
});
function updStay(a,b,c,h){const x=$('#'+a),y=$('#'+b),z=$('#'+c); if(x&&y&&z&&x.value&&y.value){z.innerHTML=stayInfoHTML(h,D(x.value),D(y.value)); translate(z)}}
document.addEventListener('change',e=>{
  if(e.target.id==='chatFile'){ const fs=[...(e.target.files||[])]; e.target.value=''; if(fs.length) sendPicked(fs); return }
  if(e.target.type==='date'&&e.target.value){const dv=e.target.parentElement.querySelector('.dv'); if(dv) dv.textContent=fmtY(D(e.target.value))}
  if(e.target.id==='depInput'&&e.target.value){S.pickDep=e.target.value; if(!S.pickRet){const r=$('#retInput'); if(r){r.value=iso(addDays(D(S.pickDep),STAY[S.pickProg])); r.parentElement.querySelector('.dv').textContent=fmtY(D(r.value))}} updStay('depInput','retInput','stayInfo',S.pick||host())}
  if(e.target.id==='retInput'&&e.target.value){S.pickRet=e.target.value; updStay('depInput','retInput','stayInfo',S.pick||host())}
  if(e.target.id==='depSheetInput'||e.target.id==='retSheetInput') updStay('depSheetInput','retSheetInput','staySheetInfo',host());
  if(e.target.id==='apFile'&&e.target.files[0]){S.apply.fileObj=e.target.files[0]; S.apply.file=e.target.files[0].name; render(true)}
  if(e.target.dataset&&e.target.dataset.custom){const inp=$('#'+e.target.dataset.custom); if(inp){inp.classList.toggle('hide',e.target.value!=='__custom'); if(e.target.value==='__custom') inp.focus()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet(); if(e.key==='Enter'&&S.screen==='login'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){const b=document.querySelector('.cta .btn'); if(b&&!b.disabled) b.click()} if(e.key==='Enter'&&e.target.id==='qInput') document.querySelector('[data-act="ask"]').click(); if(e.key==='Enter'&&!e.isComposing&&e.target.id==='chatInput'){e.preventDefault(); sendMsg()} if(e.key==='Enter'&&!e.isComposing&&e.target.id==='cMsg'){e.preventDefault(); document.querySelector('[data-act="csend"]').click()}});

render();
loadData();
</script>
</body>
</html>

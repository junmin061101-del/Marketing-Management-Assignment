<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="description" content="교환학생·썸머스쿨 합격 후 출국까지 준비를 한 곳에서 챙기는 OneStep Abroad 앱 프로토타입">
<meta name="theme-color" content="#14DBBA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%2314DBBA%27/%3E%3Cpath d=%27M5 11.8 19 5l-5 14-2.5-5.7L5 11.8Z%27 fill=%27white%27/%3E%3C/svg%3E">
<title>OneStep Abroad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Roboto:wght@400;500;700;900&display=swap">
<style>
/* Layout: one phone-sized app frame on a quiet mint stage, with a screen index beside it on wide screens. */
:root{
  --mint:#14DBBA;          /* 김과외 brand mint */
  --primary:#10BA9D;       /* buttons, filled states */
  --primary-press:#0D9F86;
  --primary-ink:#0A8A74;   /* mint text on white */
  --primary-soft:#E6FBF7;
  --primary-line:#B8F1E6;
  --navy:#012743;          /* 김과외 deep navy */
  --on-primary:#FFFFFF;
  --ink:#111827;
  --ink-2:#5F6B76;
  --ink-3:#9AA4AD;
  --line:#E7ECEE;
  --bg:#FFFFFF;
  --surface:#F4F7F7;
  --stage:#E9F3F1;
  --bezel:#0E1A20;
  --warn:#B45309; --warn-soft:#FEF3E2;
  --danger:#D93838; --danger-soft:#FDECEC;
  --shadow:0 6px 24px rgba(1,39,67,.08);
  --glow:0 18px 60px rgba(20,219,186,.45);
  --font:'Roboto','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#14C7A8; --primary-press:#10B095; --primary-ink:#45E3C8; --primary-soft:#0F2C28; --primary-line:#1C4C44;
  --navy:#BFE9FF; --on-primary:#04221D;
  --ink:#EDF2F3; --ink-2:#A2ADB5; --ink-3:#6E7A83; --line:#25313A;
  --bg:#0F161A; --surface:#172127; --stage:#070C0E; --bezel:#2A363D;
  --warn:#F5B454; --warn-soft:#33260F; --danger:#FF7B7B; --danger-soft:#3A1A1A;
  --shadow:0 6px 24px rgba(0,0,0,.35); --glow:0 18px 60px rgba(20,219,186,.28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#14C7A8; --primary-press:#10B095; --primary-ink:#45E3C8; --primary-soft:#0F2C28; --primary-line:#1C4C44;
  --navy:#BFE9FF; --on-primary:#04221D;
  --ink:#EDF2F3; --ink-2:#A2ADB5; --ink-3:#6E7A83; --line:#25313A;
  --bg:#0F161A; --surface:#172127; --stage:#070C0E; --bezel:#2A363D;
  --warn:#F5B454; --warn-soft:#33260F; --danger:#FF7B7B; --danger-soft:#3A1A1A;
  --shadow:0 6px 24px rgba(0,0,0,.35); --glow:0 18px 60px rgba(20,219,186,.28);
  color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;gap:64px;padding:24px 16px;box-sizing:border-box;min-height:100%;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- side index ---------- */
.side{width:280px;display:flex;flex-direction:column;gap:20px}
.side .brand{display:flex;align-items:center;gap:12px}
.side .brand b{font-size:22px;font-weight:900;letter-spacing:-.03em}
.side p.lead{color:var(--ink-2);font-size:14px}
.side h4{margin:0;font-size:12px;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.jump{display:flex;flex-direction:column;gap:4px}
.jump button{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 12px;border-radius:12px;color:var(--ink-2);font-size:14px;font-weight:500}
.jump button span.n{width:22px;height:22px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3)}
.jump button:hover{background:var(--bg);color:var(--ink)}
.jump button.on{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.jump button.on span.n{background:var(--primary);color:var(--on-primary)}
.side .note{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px}

/* ---------- phone ---------- */
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 48px));min-height:640px;background:var(--bg);border:10px solid var(--bezel);border-radius:48px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(1,39,67,.18);flex:none}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:700}
.status .sys{display:flex;gap:5px;align-items:center}
#view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:8px 20px 28px}
.cta{flex:none;padding:12px 20px 20px;background:var(--bg)}
.btn{width:100%;height:54px;border-radius:16px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(16,186,157,.28);transition:background .15s,transform .1s}
.btn:hover{background:var(--primary-press)}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:var(--line);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none}
.btn.sm{height:40px;border-radius:12px;font-size:14px;width:auto;padding:0 16px}

/* top bar */
.bar{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px}
.bar h2{font-size:17px;font-weight:700;flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface)}
.bar.main{padding:0 12px 0 20px}
.bar.main h2{font-size:22px;font-weight:800}

/* onboarding */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.appicon{width:120px;height:120px;border-radius:32px;background:var(--mint);display:grid;place-items:center;color:#fff;box-shadow:var(--glow)}
.appicon.sm{width:36px;height:36px;border-radius:11px;box-shadow:none}
.splash h1{font-size:36px;font-weight:900;letter-spacing:-.04em;margin-top:6px}
.splash p{color:var(--ink-2);font-size:16px;margin-top:6px}
.ob-title{font-size:24px;font-weight:800;line-height:1.35;margin-top:4px}
.ob-sub{color:var(--ink-2);font-size:14px;margin-top:8px}
.steps{display:flex;gap:6px;margin:4px 0 22px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--primary)}
.field{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.input{height:54px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-size:16px;width:100%}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;background-size:6px 6px;background-repeat:no-repeat}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink-2);background:var(--bg);white-space:nowrap}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.chip.sm{height:32px;padding:0 12px;font-size:13px}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12px;margin:22px 0 14px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.social{display:flex;flex-direction:column;gap:10px}
.social button{height:52px;border-radius:14px;border:1px solid var(--line);font-weight:500;font-size:15px}
.social button:hover{background:var(--surface)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:11px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(1,39,67,.1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.uni{display:flex;align-items:center;gap:10px;padding:14px 12px;border:1px solid var(--line);border-radius:16px;text-align:left;min-width:0;background:var(--bg)}
.uni.on{border-color:var(--primary);background:var(--primary-soft)}
.mono{width:40px;height:40px;border-radius:12px;background:var(--surface);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:-.02em;flex:none}
.uni.on .mono{background:var(--bg);color:var(--primary-ink)}
.uni .t{min-width:0}
.uni small{display:block;font-size:12px;color:var(--ink-3)}
.uni b{display:block;font-size:14px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.prog{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.radio{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:16px;text-align:left;background:var(--bg)}
.radio.on{border-color:var(--primary);background:var(--primary-soft)}
.radio .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.radio.on .dot{border-color:var(--primary);background:var(--primary)}
.radio.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-primary)}
.radio b{display:block;font-size:15px}
.radio small{color:var(--ink-2);font-size:13px}
.sect-label{font-size:13px;font-weight:700;color:var(--ink-2);margin-top:26px}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 32px}
.loading .appicon{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92)}}

/* home */
.hero{border-radius:24px;background:var(--primary-soft);padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .top{display:flex;align-items:center;gap:12px}
.hero .mono{background:var(--bg);color:var(--primary-ink)}
.hero .top .t{flex:1;min-width:0}
.hero .top b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.hero .top small{color:var(--ink-2);font-size:13px}
.hero .dday{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .dday .big{font-family:'Roboto',sans-serif;font-size:44px;font-weight:900;line-height:1;color:var(--primary-ink);letter-spacing:-.03em}
.hero .dday small{display:block;color:var(--ink-2);font-size:13px;margin-bottom:4px}
.hero .dday .r{text-align:right;font-size:13px;color:var(--ink-2)}
.hero .dday .r b{display:block;color:var(--ink);font-size:15px}
.meter{height:8px;border-radius:8px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:8px;transition:width .35s}
.next{margin-top:14px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);text-align:left;width:100%}
.next .lbl{font-size:12px;font-weight:700;color:var(--warn)}
.next b{display:block;font-size:15px}
.next .t{flex:1;min-width:0}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:24px -20px 6px;padding:0 20px}
.filters::-webkit-scrollbar{display:none}
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.list-head h3{font-size:18px;font-weight:800}
.list-head span{font-size:13px;color:var(--ink-3)}
.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.tick:hover{border-color:var(--primary)}
.tick.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.task .body{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:8px}
.task .body .t{flex:1;min-width:0}
.task b{display:block;font-size:15px;font-weight:700;line-height:1.35}
.task.done b{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.task .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:3px;flex-wrap:wrap}
.task .chev{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.cat{background:var(--surface);color:var(--ink-2)}
.pill.ok{background:var(--primary-soft);color:var(--primary-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.navy{background:var(--navy);color:var(--bg)}
.nudge{margin-top:22px;display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--surface);text-align:left;width:100%}
.nudge .t{flex:1;min-width:0}
.nudge b{display:block;font-size:14px}
.nudge small{font-size:13px;color:var(--ink-2)}
.nudge .ico{width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--primary-ink);flex:none}

/* detail */
.d-head{padding:4px 0 20px;border-bottom:8px solid var(--surface);margin:0 -20px;padding-left:20px;padding-right:20px}
.d-head h1{font-size:24px;font-weight:800;line-height:1.35;margin-top:10px}
.d-head .when{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink-2);font-size:14px}
.d-head .when b{color:var(--ink)}
.d-sec{padding-top:22px}
.d-sec h3{font-size:16px;font-weight:800;margin-bottom:10px}
.d-sec p{color:var(--ink);font-size:15px;line-height:1.65}
.tbl{width:100%;border-collapse:collapse;font-size:14px;border-radius:14px;overflow:hidden;background:var(--surface)}
.tbl th,.tbl td{text-align:left;padding:12px 14px;vertical-align:top;border-bottom:1px solid var(--bg)}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl th{width:34%;color:var(--ink-2);font-weight:500}
.tbl td{font-weight:500}
.src{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);margin-bottom:8px}
.src:hover{border-color:var(--primary)}
.src .t{flex:1;min-width:0}
.src b{display:block;font-size:14px;font-weight:700}
.src small{display:block;color:var(--ink-3);font-size:12px;overflow-wrap:anywhere}
.src .ic{color:var(--primary-ink)}
.verified{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--primary-soft);font-size:13px;color:var(--ink-2)}
.verified b{color:var(--ink)}
.verified .ic{color:var(--primary-ink);margin-top:1px}
.row-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.row-toggle b{display:block;font-size:15px}
.row-toggle small{color:var(--ink-3);font-size:13px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--primary)}
.switch.on::after{transform:translateX(20px)}
.linkbtn{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14px;padding:16px 0}
.linkbtn:hover{color:var(--ink)}
.cta.split{display:flex;gap:10px}
.cta.split .btn.ghost{flex:0 0 120px}

/* community */
.peers{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px 6px}
.peers::-webkit-scrollbar{display:none}
.peer{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px;flex:none;text-align:center}
.ava{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--navy);background:var(--surface);position:relative;flex:none}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--line) 0)}
.ring .ava{border:3px solid var(--bg);width:52px;height:52px}
.peer small{font-size:12px;color:var(--ink-2);line-height:1.25}
.peer small b{display:block;color:var(--ink);font-weight:700}
.compose{margin-top:18px;padding:16px;border-radius:18px;border:1px solid var(--line)}
.compose p{font-size:14px;font-weight:700;margin-bottom:10px}
.compose .row{display:flex;gap:8px;margin-top:10px}
.compose .input{height:44px;font-size:14px;border-radius:12px}
.post{padding:18px 0;border-bottom:1px solid var(--line)}
.post .who{display:flex;align-items:center;gap:10px}
.post .who .ava{width:36px;height:36px;font-size:13px}
.post .who .t{flex:1;min-width:0}
.post .who b{font-size:14px;display:flex;align-items:center;gap:6px}
.post .who small{font-size:12px;color:var(--ink-3)}
.post .txt{margin-top:10px;font-size:15px;line-height:1.6}
.post .q{font-weight:700}
.post .foot{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--ink-3)}
.post .foot button{color:var(--ink-3);display:flex;align-items:center;gap:4px}
.post .foot button.on{color:var(--primary-ink);font-weight:700}
.answer{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface);font-size:14px;line-height:1.55}
.answer b{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:3px;color:var(--primary-ink);font-size:12px;font-weight:700}

/* mentoring */
.mhero{border-radius:22px;background:var(--navy);color:var(--bg);padding:20px;display:flex;flex-direction:column;gap:12px}
.mhero b{font-size:18px;font-weight:800;line-height:1.4}
.mhero .flow{display:flex;gap:6px;flex-wrap:wrap}
.mhero .flow span{font-size:12px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.12);font-weight:500}
.mentor{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.mentor .ava{width:56px;height:56px;background:var(--primary-soft);color:var(--primary-ink)}
.mentor .t{flex:1;min-width:0}
.mentor .name{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px}
.mentor .prog{font-size:13px;color:var(--ink-2);margin-top:2px}
.mentor .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mentor .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
.mentor .rate{color:var(--ink-2);display:flex;align-items:center;gap:4px}
.mentor .rate .ic{color:#F5B400}
.mentor .price{font-weight:800;font-size:15px}
.mentor .price small{font-weight:500;color:var(--ink-3);font-size:12px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(1,20,30,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:26px 26px 0 0;max-height:88%;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet .scroll{padding:8px 20px 8px}
.vlist{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.vitem{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.vitem .ic{color:var(--primary-ink);margin-top:2px}
.vitem small{display:block;color:var(--ink-3);font-size:12px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots .chip{width:100%;padding:0;height:auto;padding-block:8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.slots .chip small{font-size:11px;font-weight:500;opacity:.8}
.pay{border-radius:14px;background:var(--surface);padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.pay div{display:flex;justify-content:space-between}
.pay .tot{font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.pay p{font-size:12px;color:var(--ink-3)}

/* benefits */
.cat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.cat-row button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;font-size:12px;font-weight:600;color:var(--ink-2)}
.cat-row button .ico{width:46px;height:46px;border-radius:15px;background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.cat-row button.on{color:var(--ink)}
.cat-row button.on .ico{background:var(--primary-soft);color:var(--primary-ink)}
.offer{display:flex;gap:14px;padding:18px;border-radius:20px;border:1px solid var(--line);margin-top:12px;align-items:center}
.offer .ico{width:52px;height:52px;border-radius:16px;background:var(--surface);display:grid;place-items:center;font-weight:900;color:var(--navy);font-size:13px;flex:none}
.offer .t{flex:1;min-width:0}
.offer b{display:block;font-size:15px}
.offer small{display:block;font-size:13px;color:var(--ink-2)}
.offer .deal{font-size:13px;font-weight:800;color:var(--primary-ink);margin-top:4px}
.why{margin-top:18px;font-size:12px;color:var(--ink-3);line-height:1.6}

/* my */
.me{display:flex;align-items:center;gap:14px;padding:6px 0 20px}
.me .ava{width:60px;height:60px;font-size:20px;background:var(--primary-soft);color:var(--primary-ink)}
.me b{font-size:18px;font-weight:800;display:block}
.me small{color:var(--ink-2);font-size:13px}
.menu{border-top:8px solid var(--surface);margin:0 -20px;padding:0 20px}
.menu button,.menu .m{display:flex;align-items:center;gap:12px;width:100%;padding:16px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15px;font-weight:500}
.menu button:last-child{border-bottom:0}
.menu .t{flex:1}
.menu small{color:var(--ink-3);font-size:13px}
.apply-card{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;background:var(--navy);color:var(--bg);text-align:left;width:100%;margin-bottom:20px}
.apply-card .t{flex:1}
.apply-card b{display:block;font-size:16px}
.apply-card small{font-size:13px;opacity:.8}

/* mentor verification */
.vstep{display:flex;gap:14px;padding-bottom:22px;position:relative}
.vstep:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:4px;width:2px;background:var(--line)}
.vstep.done:not(:last-child)::before{background:var(--primary)}
.vstep .n{width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--ink-3);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;z-index:1}
.vstep.cur .n{background:var(--bg);color:var(--primary-ink);border:2px solid var(--primary)}
.vstep.done .n{background:var(--primary);color:var(--on-primary)}
.vstep .t{flex:1;min-width:0;padding-top:4px}
.vstep b{display:block;font-size:15px}
.vstep small{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.vstep .act{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.vstep .act .row{display:flex;gap:8px}
.vstep .act .input{height:46px;font-size:14px;border-radius:12px}
.file{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;border:1.5px dashed var(--primary-line);color:var(--primary-ink);font-weight:700;font-size:14px;cursor:pointer;background:var(--primary-soft)}
.file input{position:absolute;width:1px;height:1px;opacity:0}

/* tabbar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 6px 14px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--ink-3)}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ic{color:var(--primary-ink)}
.tabbar button .dotw{position:relative}
.tabbar button .dotw i{position:absolute;top:-2px;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--danger)}

.toast{position:absolute;left:20px;right:20px;bottom:96px;z-index:30;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:14px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(10px);pointer-events:none;transition:all .25s}
.toast.on{opacity:1;transform:none}
.toast .ic{color:var(--mint)}
.sample{display:inline-flex;font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

@media (max-width:980px){.side{display:none}}
@media (max-width:560px){
  body{padding:0;display:block}
  .phone{width:100%;height:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .status{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ---------------- icons ---------------- */
const I={

/* ---------------- dates ---------------- */
const TODAY=new Date(2026,9,5);

const REGIONS=[['asia','아시아'],['europe','유럽'],['us','미국']];

        <div class="vitem">${ic('shield',18)}<span>운영팀 심사 통과<small>2025.12 승인</small></span></div></div></div>
      <div class="d-sec"><h3>시간 선택</h3><div class="slots">${slots.map((s,k)=>`<button class="chip${S.slot===k?' on':''}" data-act="slot" data-v="${k}"><span class="num">${fmtShort(s.d)} (${WD[s.d.getDay()]})</span><small class="num">${s.hh}:00</small></button>`).join('')}</div></div>

let tt;
function toast(msg){const t=$('#toast');t.innerHTML=ic('check',18,2.6)+'<span>'+esc(msg)+'</span>';t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------------- render ---------------- */
const TABS=[['home','list','홈'],['community','chat','커뮤니티'],['mentor','mentor','멘토링'],['benefit','gift','혜택'],['my','user','마이']];
let lastKey='';
function render(keepScroll){
  const key=S.screen+S.tab+S.detail;
  const sc=view.querySelector('.scroll'); const top=sc&&keepScroll&&key===lastKey?sc.scrollTop:0;
  view.innerHTML=SCREENS[S.screen]();
  const ns=view.querySelector('.scroll'); if(ns) ns.scrollTop=top;
  lastKey=key;
  const tb=$('#tabbar'); const showTabs=S.screen==='app';
  tb.hidden=!showTabs;
  if(showTabs) tb.innerHTML=TABS.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-v="${k}" aria-current="${S.tab===k?'page':'false'}">${ic(i,24)}${l}</button>`).join('');
  renderJump();
}
const JUMPS=[['시작 화면',{screen:'splash'}],['학교 정보 입력',{screen:'profile'}],['프로그램 선택',{screen:'program'}],['홈 · 맞춤 체크리스트',{screen:'app',tab:'home'}],['항목 상세 · 공식 출처',{screen:'detail',detail:'visa'}],['커뮤니티',{screen:'app',tab:'community'}],['인증 멘토링',{screen:'app',tab:'mentor'}],['출국 준비 혜택',{screen:'app',tab:'benefit'}],['멘토 인증 절차',{screen:'mentorApply'}]];
function curJump(){return JUMPS.findIndex(([,j])=>j.screen===S.screen&&(!j.tab||j.tab===S.tab))}
function renderJump(){
  const c=curJump();
  $('#jump').innerHTML=JUMPS.map(([l],k)=>`<button class="${k===c?'on':''}" data-jump="${k}"><span class="n">${k+1}</span>${l}</button>`).join('');
}
function go(screen){S.screen=screen; if(screen!=='detail')S.detail=null; closeSheet(); render()}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');
  if(j){const t=JUMPS[+j.dataset.jump][1]; Object.assign(S,t); if(t.screen==='detail'&&!items().some(i=>i.id===t.detail)) S.detail=items()[2].id; if(t.screen!=='detail')S.detail=null; closeSheet(); render(); return}
  const g=e.target.closest('[data-go]');
  if(g){ if(S.screen==='login'){const v=$('#email');if(v)S.email=v.value} go(g.dataset.go); return}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const v=a.dataset.v, act=a.dataset.act;
  if(act.startsWith('go:')) return go(act.slice(3));
  switch(act){
    case 'back': go('app'); break;
    case 'year': S.profile.year=v; render(true); break;
    case 'region': S.region=v; if(host().region!==v){S.hostId=HOSTS.find(h=>h.region===v).id;} render(true); break;
    case 'host': S.hostId=v; render(true); break;
    case 'prog': S.progId=v; render(true); break;
    case 'build': S.posts=null; S.done=new Set(['app','eng']); S.screen='building'; render(); setTimeout(()=>{S.screen='app';S.tab='home';render()},1100); break;
    case 'tab': S.tab=v; S.screen='app'; S.detail=null; closeSheet(); render(); break;
    case 'filter': S.filter=v; render(true); break;
    case 'open': S.detail=v; go('detail'); break;
    case 'toggleDone': {const was=S.done.has(v); was?S.done.delete(v):S.done.add(v); render(true); if(!was) toast('완료로 표시했어요'); break}
    case 'remind': S.remind.has(v)?S.remind.delete(v):S.remind.add(v); render(true); toast(S.remind.has(v)?'마감 알림을 켰어요':'마감 알림을 껐어요'); break;
    case 'flag': toast('변경 제보를 받았어요. 운영팀이 확인 후 반영해요'); break;
    case 'toast': toast(v); break;
    case 'ctab': S.ctab=v; render(true); break;
    case 'share': {const P=S.profile; S.posts.unshift({type:'status',who:'나',meta:`${P.major} ${P.year}`,tag:v,text:`${v}! 같이 준비하는 분들 화이팅이에요.`,time:'방금',likes:0}); render(); toast('준비 현황을 공유했어요'); break}
    case 'ask': {const q=$('#qInput'); const t=q&&q.value.trim(); if(!t){q&&q.focus();return} const P=S.profile; S.posts.unshift({type:'q',who:'나',meta:`${P.major} ${P.year}`,text:t,time:'방금',answers:0}); render(); toast('질문을 올렸어요'); break}
    case 'like': {const k=+v; S.liked.has(k)?S.liked.delete(k):S.liked.add(k); render(true); break}
    case 'mentor': openMentorSheet(+v); break;
    case 'closeSheet': closeSheet(); break;
    case 'slot': S.slot=+v; $('#sheet')._draw(); break;
    case 'book': {const sl=$('#sheet')._slots[S.slot]; S.booked[S.mentorSheet]=sl; const m=mentorsFor()[S.mentorSheet]; closeSheet(); render(true); toast(`${m.name} 멘토와 ${fmtShort(sl.d)} ${sl.hh}:00 예약했어요`); break}
    case 'bcat': S.bcat=S.bcat===v?'전체':v; render(true); break;
    case 'changeProg': S.region=host().region; go('program'); break;
    case 'ap0': {const em=$('#apEmail').value.trim(); if(!/^[^@\s]+@[^@\s]+\.ac\.kr$/.test(em)){toast('ac.kr로 끝나는 학교 이메일을 입력하세요');return} S.apply.email=em; S.apply.step=1; render(true); toast('학교 이메일을 인증했어요'); break}
    case 'ap1': S.apply.step=2; render(true); toast('수료 증빙을 제출했어요'); break;
    case 'ap2': S.apply.step=3; render(true); toast('인증 멘토 배지가 발급됐어요'); break;
  }
});
document.addEventListener('change',e=>{
  const m=e.target.dataset.model; if(m){S.profile[m]=e.target.value}
  if(e.target.id==='apFile'&&e.target.files[0]){S.apply.file=e.target.files[0].name; render(true)}
});
document.addEventListener('input',e=>{const m=e.target.dataset.model; if(m) S.profile[m]=e.target.value; if(e.target.id==='email') S.email=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet(); if(e.key==='Enter'&&e.target.id==='qInput') document.querySelector('[data-act="ask"]').click()});

$('#sideIcon').innerHTML=ic('plane',20,2);
render();
</script>

</body>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교환가자</title>
<meta name="description" content="교환가자 — a post-selection preparation app for exchange and summer school students: personalized checklist, program community, verified mentors and departure perks.">
<meta name="theme-color" content="#F2F4F6">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="교환가자">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: a true-size iPhone (393 × 852 pt) on a quiet mint stage, with a screen index beside it on wide screens. */
:root{
  --mint:#14DBBA;          /* 김과외 brand mint */
  --primary:#10BA9D;
  --primary-press:#0D9F86;
  --primary-ink:#0A8A74;
  --primary-soft:#E6FBF7;
  --primary-line:#B8F1E6;
  --navy:#012743;          /* 김과외 deep navy */
  --on-primary:#FFFFFF;
  --ink:#111827;
  --ink-2:#5F6B76;
  --ink-3:#9AA4AD;
  --line:#E7ECEE;
  --bg:#FFFFFF;
  --surface:#F4F7F7;
  --stage:#E9F3F1;
  --bezel:#0E1A20;
  --warn:#B45309; --warn-soft:#FEF3E2;
  --danger:#D93838; --danger-soft:#FDECEC;
  --shadow:0 6px 24px rgba(1,39,67,.08);
  --glow:0 18px 60px rgba(20,219,186,.45);
  --font:'Plus Jakarta Sans','Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-ko:'Pretendard Variable','Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --card:#FFFFFF; --track:#E7ECED; --hero:#012743; --hero-2:#0B3A5C; --mint-bright:#14DBBA;
  --card-shadow:0 1px 2px rgba(1,39,67,.04),0 4px 16px rgba(1,39,67,.05);
  --sab:34px;              /* iPhone home-indicator safe area */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#14C7A8; --primary-press:#10B095; --primary-ink:#45E3C8; --primary-soft:#0F2C28; --primary-line:#1C4C44;
  --navy:#BFE9FF; --on-primary:#04221D;
  --ink:#EDF2F3; --ink-2:#A2ADB5; --ink-3:#6E7A83; --line:#25313A;
  --bg:#0F161A; --surface:#172127; --stage:#070C0E; --bezel:#2A363D;
  --warn:#F5B454; --warn-soft:#33260F; --danger:#FF7B7B; --danger-soft:#3A1A1A;
  --shadow:0 6px 24px rgba(0,0,0,.35); --glow:0 18px 60px rgba(20,219,186,.28);
  --card:#1C2830; --track:#0F161A; --hero:#0D2B40; --hero-2:#123B57; --card-shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#14C7A8; --primary-press:#10B095; --primary-ink:#45E3C8; --primary-soft:#0F2C28; --primary-line:#1C4C44;
  --navy:#BFE9FF; --on-primary:#04221D;
  --ink:#EDF2F3; --ink-2:#A2ADB5; --ink-3:#6E7A83; --line:#25313A;
  --bg:#0F161A; --surface:#172127; --stage:#070C0E; --bezel:#2A363D;
  --warn:#F5B454; --warn-soft:#33260F; --danger:#FF7B7B; --danger-soft:#3A1A1A;
  --shadow:0 6px 24px rgba(0,0,0,.35); --glow:0 18px 60px rgba(20,219,186,.28);
  --card:#1C2830; --track:#0F161A; --hero:#0D2B40; --hero-2:#123B57; --card-shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;gap:64px;padding:16px;box-sizing:border-box;min-height:100%;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.ko{font-family:var(--font-ko)}

/* ---------- device: iPhone 15 / 16, 393 × 852 pt ---------- */
.device{position:relative;padding:12px;background:var(--bezel);border-radius:68px;box-shadow:0 30px 80px rgba(1,39,67,.2);flex:none;zoom:var(--z,1)}
.phone{position:relative;width:393px;height:852px;background:var(--bg);border-radius:56px;overflow:hidden;display:flex;flex-direction:column}
.status{height:54px;flex:none;display:grid;grid-template-columns:1fr 126px 1fr;align-items:center;font-size:16px;font-weight:700;padding:0 8px}
.status .time{text-align:center;letter-spacing:-.01em}
.status .sys{display:flex;gap:6px;align-items:center;justify-content:center}
#view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:8px 20px 28px}
.cta{flex:none;padding:12px 20px calc(12px + var(--sab));background:var(--bg)}
.btn{width:100%;height:54px;border-radius:16px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:none;transition:background .15s,transform .1s}
.btn:hover{background:var(--primary-press)}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:var(--line);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none}
.btn.sm{height:40px;border-radius:12px;font-size:14px;width:auto;padding:0 16px}

.bar{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px}
.bar h2{font-size:17px;font-weight:700;flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface)}
.bar.main{padding:0 12px 0 20px}
.bar.main h2{font-size:26px;font-weight:800}

/* onboarding */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:0 24px}
.appicon{width:120px;height:120px;border-radius:32px;background:var(--mint);display:grid;place-items:center;color:#fff;box-shadow:var(--glow)}
.appicon.sm{width:36px;height:36px;border-radius:11px;box-shadow:none}
.appicon.logo{background:none;box-shadow:none;border-radius:0}.appicon.logo img{width:100%;height:100%;display:block}
.splash h1{font-family:var(--font-ko);font-size:40px;font-weight:900;letter-spacing:-.04em;margin-top:6px}
.splash p{color:var(--ink-2);font-size:16px;margin-top:6px}
.ob-title{font-size:26px;font-weight:800;line-height:1.3;margin-top:4px}
.ob-sub{color:var(--ink-2);font-size:14px;margin-top:8px}
.steps{display:flex;gap:6px;margin:4px 0 22px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--primary)}
.field{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.field label,.field .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.input{height:54px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-size:16px;width:100%}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search{position:relative}
.search .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search .input{padding-left:46px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink-2);background:var(--bg);white-space:nowrap}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.chip.sm{height:32px;padding:0 12px;font-size:13px}
.chip small{font-weight:500;color:var(--ink-3);margin-left:4px}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.hscroll::-webkit-scrollbar{display:none}
.social{display:flex;flex-direction:column;gap:10px}
.social button{height:52px;border-radius:14px;border:1px solid var(--line);font-weight:500;font-size:15px}
.social button:hover{background:var(--surface)}
.picked{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--primary);background:var(--primary-soft)}
.picked .t{flex:1;min-width:0;font-weight:700}
.picked .t small{display:block;font-weight:500;color:var(--ink-2);font-size:12px}
.picked button{font-size:13px;font-weight:700;color:var(--primary-ink)}
.sugg.majors{max-height:280px;overflow:auto}.sugg .hn small{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.sugg{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--surface)}
.sugg .hn{display:flex;flex-direction:column;min-width:0}
.sugg .hn b{font-weight:600}
.sugg .hn small{font-size:12px;color:var(--ink-3)}
.sugg .empty{padding:14px;color:var(--ink-3);font-size:13px}
.sugg mark,.srow mark{background:none;color:var(--primary-ink);font-weight:800}

.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:11px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(1,39,67,.1)}
.mono{width:40px;height:40px;border-radius:12px;background:var(--surface);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:-.03em;flex:none;overflow:hidden}
.srow.on .mono{background:var(--bg);color:var(--primary-ink)}
.sect-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;color:var(--ink-2);margin:24px 0 10px}
.sect-label span{font-weight:500;color:var(--ink-3)}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 8px;border-radius:14px}
.srow:hover{background:var(--surface)}
.srow.on{background:var(--primary-soft)}
.srow .t{flex:1;min-width:0}
.srow b{display:block;font-size:14px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.srow small{display:block;font-size:12px;color:var(--ink-3)}
.srow .ok{color:var(--primary-ink)}
.more{width:100%;height:44px;border-radius:12px;background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2);margin-top:8px}
.loadmsg{padding:24px 0;text-align:center;color:var(--ink-3);font-size:14px}

.school-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--surface)}
.school-card .mono{background:var(--bg);color:var(--primary-ink);width:46px;height:46px}
.school-card .t{flex:1;min-width:0}
.school-card b{display:block;font-size:15px;line-height:1.3}
.school-card small{color:var(--ink-2);font-size:13px}
.school-card button{font-size:13px;font-weight:700;color:var(--primary-ink);flex:none}
.popt{display:block;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--bg);margin-top:10px}
.popt.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary) inset}
.popt .h{display:flex;align-items:center;gap:10px}
.popt .h .t{flex:1;min-width:0}
.popt .h b{display:block;font-size:16px;font-weight:800}
.radio-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.popt.on .radio-dot{border-color:var(--primary);background:var(--primary)}
.popt.on .radio-dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-primary)}
.popt p{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.55}
.popt dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:13px}
.popt dt{color:var(--ink-3)}
.popt dd{margin:0;font-weight:600}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 32px}
.loading .appicon{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92)}}

/* home */
.hero{border-radius:24px;background:var(--primary-soft);padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .top{display:flex;align-items:center;gap:12px}
.hero .mono{background:var(--bg);color:var(--primary-ink)}
.hero .top .t{flex:1;min-width:0}
.hero .top b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.hero .top small{color:var(--ink-2);font-size:13px}
.meter{height:8px;border-radius:8px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:8px;transition:width .35s}
.next{margin-top:14px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);text-align:left;width:100%}
.next .lbl{font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.04em}
.next b{display:block;font-size:15px}
.next .t{flex:1;min-width:0}
.filters{margin:24px -20px 6px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.list-head h3{font-size:18px;font-weight:800}
.list-head span{font-size:13px;color:var(--ink-3)}
.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.tick:hover{border-color:var(--primary)}
.tick.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.task .body{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:8px}
.task .body .t{flex:1;min-width:0}
.task b{display:block;font-size:15px;font-weight:700;line-height:1.35}
.task.done b{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.task .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:3px;flex-wrap:wrap}
.task .chev{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.cat{background:var(--surface);color:var(--ink-2)}
.pill.ok{background:var(--primary-soft);color:var(--primary-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.nudge{margin-top:22px;display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:var(--surface);text-align:left;width:100%}
.nudge .t{flex:1;min-width:0}
.nudge b{display:block;font-size:14px}
.nudge small{font-size:13px;color:var(--ink-2)}
.nudge .ico{width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--primary-ink);flex:none}

/* detail */
.d-head{border-bottom:8px solid var(--surface);margin:0 -20px;padding:4px 20px 20px}
.d-head h1{font-size:26px;font-weight:800;line-height:1.3;margin-top:10px}
.d-head .when{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink-2);font-size:14px}
.d-head .when b{color:var(--ink)}
.d-sec{padding-top:22px}
.d-sec h3{font-size:16px;font-weight:800;margin-bottom:10px}
.d-sec p{color:var(--ink);font-size:15px;line-height:1.65}
.tbl{width:100%;border-collapse:collapse;font-size:14px;border-radius:14px;overflow:hidden;background:var(--surface)}
.tbl th,.tbl td{text-align:left;padding:12px 14px;vertical-align:top;border-bottom:1px solid var(--bg)}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl th{width:34%;color:var(--ink-2);font-weight:500}
.tbl td{font-weight:500}
.src{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);margin-bottom:8px}
.src:hover{border-color:var(--primary)}
.src .t{flex:1;min-width:0}
.src b{display:block;font-size:14px;font-weight:700}
.src small{display:block;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .ic{color:var(--primary-ink)}
.eng{border:1.5px solid var(--primary);border-radius:16px;padding:14px;background:var(--bg)}
.eng.est{border-style:dashed;border-color:var(--line)}
.eng-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eng-top b{font-size:14px}
.eng-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.eng-grid div{background:var(--primary-soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;min-width:0}
.eng.est .eng-grid div{background:var(--surface)}
.eng-grid small{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.eng-grid b{font-size:24px;font-weight:900;line-height:1.15;color:var(--primary-ink);letter-spacing:-.02em}
.eng.est .eng-grid b{color:var(--ink);font-size:18px}
.eng-grid em{font-style:normal;font-size:11px;color:var(--ink-3);line-height:1.3;margin-top:2px}
.eng-grid small,.eng-grid em{overflow-wrap:normal;word-break:keep-all;hyphens:none}
.eng-grid div.wide{grid-column:1/-1}
.eng-grid div.wide b{font-size:17px;line-height:1.3;letter-spacing:-.01em}
.eng>p{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.5}
.guide{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.guide>li{display:flex;gap:12px;position:relative;padding-bottom:18px}
.guide>li:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--primary-line)}
.guide .gn{width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;z-index:1}
.guide .gt{flex:1;min-width:0;padding-top:3px}
.guide .gt b{display:block;font-size:15px;line-height:1.35}
.guide .gt p{font-size:14px;color:var(--ink-2);line-height:1.55;margin-top:4px}
.need{list-style:none;margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
.need li{display:flex;gap:7px;align-items:flex-start}
.need .ic{color:var(--primary-ink);margin-top:2px}
.src.mini{padding:10px 12px;margin:8px 0 0;border-radius:12px;gap:10px}
.src.mini b{font-size:13px}
.src.guess{border-style:dashed}
.src.guess .ic{color:var(--ink-3)}
.plink{margin:-2px 2px 0}
.depfield{margin-top:10px;padding:14px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.dhead{font-size:14px;font-weight:700}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.datebox,.depfield .datebox{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);min-width:0;cursor:pointer}
.datebox small{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2)}
.datebox small .ic{color:var(--primary-ink)}

.sess .sh{display:flex;align-items:center;gap:10px}.sess .sh .t{flex:1;min-width:0;display:flex;flex-direction:column}.sess .sh .t b{font-size:15px}.sess .sh .t small{font-size:12px;color:var(--ink-3)}
.sess .sh .ava{width:36px;height:36px;font-size:14px}
.sess .ometa span{background:var(--surface)}

.input.area.big{min-height:190px}

.sample{display:inline-flex;font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* me */
.me{display:flex;align-items:center;gap:14px;padding:6px 0 20px}
.me .ava{width:60px;height:60px;font-size:20px;background:var(--primary-soft);color:var(--primary-ink)}
.me .t{min-width:0}
.me b{font-size:18px;font-weight:800;display:block}
.me small{color:var(--ink-2);font-size:13px}
.menu{border-top:8px solid var(--surface);margin:0 -20px;padding:0 20px}
.menu button,.menu .m{display:flex;align-items:center;gap:12px;width:100%;padding:16px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15px;font-weight:500}
.menu button:last-child{border-bottom:0}
.menu .t{flex:1;min-width:0}
.menu small{color:var(--ink-3);font-size:13px}
.apply-card{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;background:var(--navy);color:var(--bg);text-align:left;width:100%;margin-bottom:20px}
.apply-card .t{flex:1}
.apply-card b{display:block;font-size:16px}
.apply-card small{font-size:13px;opacity:.8}

/* mentor verification */
.vstep{display:flex;gap:14px;padding-bottom:22px;position:relative}
.vstep:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:4px;width:2px;background:var(--line)}
.vstep.done:not(:last-child)::before{background:var(--primary)}
.vstep .n{width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--ink-3);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;z-index:1}
.vstep.cur .n{background:var(--bg);color:var(--primary-ink);border:2px solid var(--primary)}
.vstep.done .n{background:var(--primary);color:var(--on-primary)}
.vstep .t{flex:1;min-width:0;padding-top:4px}
.vstep b{display:block;font-size:15px}
.vstep small{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.vstep .act{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.vstep .act .row{display:flex;gap:8px}
.vstep .act .input{height:46px;font-size:14px;border-radius:12px}
.file{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;border:1.5px dashed var(--primary-line);color:var(--primary-ink);font-weight:700;font-size:14px;cursor:pointer;background:var(--primary-soft);padding:0 12px;text-align:center}
.file input{position:absolute;width:1px;height:1px;opacity:0}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 6px var(--sab)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;font-weight:600;color:var(--ink-3)}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ic{color:var(--primary-ink)}

.toast{position:absolute;left:20px;right:20px;bottom:calc(96px + var(--sab));z-index:30;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:14px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(10px);pointer-events:none;transition:all .25s}
.toast.on{opacity:1;transform:none}
.toast .ic{color:var(--mint)}

@media (max-width:500px){
  :root{--sab:env(safe-area-inset-bottom,0px)}
  body{padding:0;display:block}
  .device{padding:0;border-radius:0;background:none;box-shadow:none;zoom:1;height:100%}
  .phone{width:100%;height:100%;height:100dvh;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  .status{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =====================================================================
   Design refresh: Triple-style home, Toss-style surface contrast,
   coffee-chat cards. Main tabs sit on --surface; content floats on
   borderless --card panels. Mint is reserved for progress, CTAs, badges.
   ===================================================================== */
body{font-feature-settings:'ss01' 0;letter-spacing:-.005em}
h1,h2,h3{letter-spacing:-.03em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* surfaces */
#view.surf{background:var(--surface)}
#view.surf .bar{background:var(--surface)}
.bar.main h2{font-size:24px;font-weight:800;letter-spacing:-.035em}

/* hero: plain card that says the countdown as a sentence */
.hero{background:var(--card);color:var(--ink);border-radius:22px;padding:20px;gap:0;box-shadow:var(--card-shadow)}
.hero .top{gap:10px}
.hero .mono{width:36px;height:36px;border-radius:10px;font-size:11px;background:var(--surface);color:var(--ink-2)}
.hero .top b{font-size:15px;font-weight:700;color:var(--ink)}
.hero .top small{font-size:12px;color:var(--ink-3)}
.hero .lead{margin-top:18px;font-size:24px;font-weight:700;line-height:1.35;letter-spacing:-.03em;color:var(--ink)}
.hero .lead em{font-style:normal;color:var(--primary);font-variant-numeric:tabular-nums}
.hero .trip{display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;font-size:14px;color:var(--ink-2);text-align:left;white-space:nowrap}
.hero .trip .d{overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero .trip .edit{margin-left:auto;flex:none;font-size:13px;font-weight:600;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.hero .prog{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.hero .prog .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.hero .prog .row b{font-weight:700;color:var(--ink)}
.hero .meter{height:6px;background:var(--track)}
.hero .meter i{background:var(--primary)}

/* next task: a plain row card, no decoration */
.next{margin-top:10px;background:var(--card);border:0;border-radius:18px;padding:16px 16px 16px 18px;box-shadow:var(--card-shadow);gap:10px}
.next .lbl{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:none;letter-spacing:0;white-space:nowrap}
.next .lbl .soon{color:var(--warn)}
.next b{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.4}
.next>.ic{color:var(--ink-3)}

/* checklist: open items in a card, completed folded */
.filters{margin:22px -20px 4px}
.filters .chip{background:var(--card);border-color:transparent}
.filters .chip.on{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.list-head{margin-top:20px}
.list-head h3{font-size:17px;letter-spacing:-.03em}
.card-list{margin-top:10px;background:var(--card);border-radius:20px;padding:2px 16px;box-shadow:var(--card-shadow)}
.card-list .task{border-bottom:1px solid var(--line)}
.card-list .task:last-child{border-bottom:0}
.card-list .empty{padding:18px 0;text-align:center;font-size:14px;color:var(--ink-3)}
.donefold{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:10px;height:44px;border-radius:14px;background:var(--track);font-size:13px;font-weight:700;color:var(--ink-2)}
.donefold .ic{transform:rotate(90deg);transition:transform .2s}
.donefold.on .ic{transform:rotate(-90deg)}
.done-list{opacity:.85}
.nudge{background:var(--card);box-shadow:var(--card-shadow);border-radius:20px}
.nudge .ico{background:var(--primary-soft)}

/* shared card tone on surface pages */
#view.surf .compose,#view.surf .ccard,#view.surf .tripcard,#view.surf .perk,#view.surf .offer,#view.surf .menu,#view.surf div.me:not(.msg){background:var(--card);border:0;box-shadow:var(--card-shadow)}
#view.surf .compose{border-radius:20px}
#view.surf .csearch .input{background:var(--card);border-color:transparent;box-shadow:var(--card-shadow)}
#view.surf .csearch .input:focus{border-color:var(--primary)}
#view.surf .compose .input{background:var(--surface);border-color:transparent}

/* segmented control on a track */
.seg{background:var(--track);border-radius:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(1,39,67,.12)}

/* community */
.ccard{border-radius:20px;padding:18px}
.ctop .mono{background:var(--surface)}
.mychips .chip{background:var(--card);border-color:transparent}
.mychips .chip.on{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.peers{margin-top:6px}
.post{background:var(--card);border:0;border-radius:20px;padding:16px 16px 12px;margin-top:10px;box-shadow:var(--card-shadow)}
.post .who{align-items:center}
.post .who b{font-size:14px;font-weight:700}
.post .who small{display:block;margin-top:1px}
.post .who .ava{background:var(--primary-soft);color:var(--primary-ink)}
.post .txt{margin-top:12px;font-size:15px;line-height:1.6}
.post .answer{background:var(--surface)}
.post .foot{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}

/* mentors: coffee-chat cards */
.mhero{border-radius:22px}
.mhero .flow span{background:rgba(255,255,255,.1)}
.mentor{background:var(--card);border:0;border-radius:20px;padding:18px;margin-top:10px;box-shadow:var(--card-shadow);gap:14px}
.mentor .ava{width:52px;height:52px;font-size:18px;font-weight:800}
.mentor .name{font-size:16px;letter-spacing:-.02em}
.mentor .tags{margin-top:10px}
.mentor .tags .pill{background:var(--surface);color:var(--ink-2);font-weight:600}
.mentor .intro{display:block;margin-top:10px;font-size:13px;line-height:1.55;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mentor .bottom{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mentor .rate{gap:4px}
.mentor .rate .price{margin-left:10px;font-size:14px}
.mcta{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--primary);color:var(--on-primary);font-size:13px;font-weight:700;display:inline-flex;align-items:center}
.mcta.ghost{background:var(--primary-soft);color:var(--primary-ink)}
.chatrow{background:var(--card);border-radius:18px;margin-top:8px;padding:12px 14px;box-shadow:var(--card-shadow)}

/* perks */
.tripcard{border-radius:20px}
.tripcard .ico{background:var(--primary-soft)}
.cat-row button .ico{background:var(--card);box-shadow:var(--card-shadow)}
.cat-row button.on .ico{background:var(--navy);color:var(--bg)}
.perk{border-radius:20px;padding:16px;margin-top:10px}
.perk.guess{border:1px dashed var(--line)!important}
.perk .pm{background:var(--surface)}
.offer{border-radius:20px}

/* checklist item detail */
.dview .d-head{background:var(--card);border:0;margin:4px 0 0;border-radius:22px;padding:20px;box-shadow:var(--card-shadow)}
.dview .d-head h1{font-size:23px;letter-spacing:-.035em}
.dview>.d-sec{background:var(--card);border-radius:20px;padding:18px;margin-top:10px;box-shadow:var(--card-shadow)}
.dview .eng-grid b{color:var(--ink);letter-spacing:-.04em}
.dview .eng{border-width:1px}

/* calm palette: neutral grays, one blue accent */
:root{--mint:#2F6FED; --primary:#2F6FED; --primary-press:#2459C9; --primary-ink:#2459C9; --primary-soft:#EEF3FE; --primary-line:#CADAFB;
  --navy:#191F28; --on-primary:#FFFFFF; --ink:#191F28; --ink-2:#4E5968; --ink-3:#8B95A1; --line:#EBEEF1;
  --bg:#FFFFFF; --surface:#F2F4F6; --stage:#E8EBEE; --card:#FFFFFF; --track:#E5E8EB;
  --warn:#C2410C; --warn-soft:#FFF1E7;
  --shadow:0 4px 16px rgba(25,31,40,.06); --glow:0 16px 40px rgba(47,111,237,.28);
  --card-shadow:0 1px 3px rgba(25,31,40,.04)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mint:#4E86F7; --primary:#4E86F7; --primary-press:#3C74E6; --primary-ink:#8DB1FA; --primary-soft:#1D2840; --primary-line:#2C3D63;
  --navy:#F2F4F6; --on-primary:#FFFFFF; --ink:#ECEEF1; --ink-2:#AEB5BE; --ink-3:#6E7682; --line:#2B2E35;
  --bg:#17181C; --surface:#0F1013; --stage:#08090B; --card:#1E1F24; --track:#2A2C32;
  --warn:#FB923C; --warn-soft:#3A2414;
  --shadow:0 4px 16px rgba(0,0,0,.4); --glow:0 16px 40px rgba(78,134,247,.25);
  --card-shadow:none;
  color-scheme:dark}}
:root[data-theme="dark"]{--mint:#4E86F7; --primary:#4E86F7; --primary-press:#3C74E6; --primary-ink:#8DB1FA; --primary-soft:#1D2840; --primary-line:#2C3D63;
  --navy:#F2F4F6; --on-primary:#FFFFFF; --ink:#ECEEF1; --ink-2:#AEB5BE; --ink-3:#6E7682; --line:#2B2E35;
  --bg:#17181C; --surface:#0F1013; --stage:#08090B; --card:#1E1F24; --track:#2A2C32;
  --warn:#FB923C; --warn-soft:#3A2414;
  --shadow:0 4px 16px rgba(0,0,0,.4); --glow:0 16px 40px rgba(78,134,247,.25);
  --card-shadow:none;
  color-scheme:dark}

/* Korean breaks between words, never inside one */
body{word-break:keep-all;overflow-wrap:break-word}
.pill,.chip,.btn,.mcta,.price,.rate,.edit,.lbl,.seg button,.cat-row button,.go{white-space:nowrap}

/* filters and toggles use ink, not a brand color */
.filters .chip.on,.mychips .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat-row button.on .ico{background:var(--ink);color:var(--bg)}

/* mentor hero and apply card: flat, no gradients */
.mhero{background:var(--card);color:var(--ink);box-shadow:var(--card-shadow)}
.mhero b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.mhero .flow span{background:var(--surface);color:var(--ink-2)}
#view.surf .apply-card{background:var(--primary);color:#fff}

/* mentor card footer */
.mentor .bottom{align-items:center;gap:10px}
.mentor .pr{display:flex;flex-direction:column;gap:2px;min-width:0}
.mentor .price{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:0}
.mentor .price small{font-size:12px;font-weight:500;color:var(--ink-3)}
.mentor .rate{font-size:12px;gap:3px}
.mentor .rate .num{color:var(--ink-3)}
.mentor .ava{width:46px;height:46px;font-size:16px}
.mentor .intro{color:var(--ink-2)}
.post .who .ava,.chatrow .ava,.me .ava{background:var(--surface);color:var(--ink-2)}

/* me tab */
#view.surf div.me:not(.msg){border-radius:20px;padding:16px}
#view.surf .menu{border-radius:20px;overflow:hidden;margin:0;border-top:0;padding:0 16px}
#view.surf div.me:not(.msg){margin-bottom:12px}
#view.surf .apply-card{background:var(--primary);color:#fff;margin-bottom:12px}

/* =====================================================================
   App shell: no prototype frame. Phones get the app full screen; wider
   windows keep content in a readable column; desktops move the tab bar
   to a left sidebar and show sheets as centred dialogs.
   ===================================================================== */
html,body{height:100%}
body{display:block;padding:0;gap:0;background:var(--bg)}
.device{padding:0;border-radius:0;background:none;box-shadow:none;zoom:1;height:100%}
.phone{width:100%;height:100%;height:100dvh;border-radius:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
:root{--sab:env(safe-area-inset-bottom,0px)}
.tb-brand{display:none}
@media (min-width:700px){
  #view .scroll.pad,#view .scroll .pad{padding-left:max(20px,calc(50% - 340px));padding-right:max(20px,calc(50% - 340px))}
  #view>.bar{padding-left:max(8px,calc(50% - 352px));padding-right:max(12px,calc(50% - 340px))}
  #view>.bar.main{padding-left:max(8px,calc(50% - 352px))}
  #view>.cta{padding-left:max(20px,calc(50% - 340px));padding-right:max(20px,calc(50% - 340px))}
  .filters{margin-left:0;margin-right:0}
  .toast{left:50%;right:auto;width:min(420px,calc(100% - 40px));transform:translate(-50%,8px)}
  .toast.on{transform:translate(-50%,0)}
}
@media (min-width:1000px){
  .phone{display:grid;grid-template-columns:240px 1fr;grid-template-rows:100%}
  .phone:has(>#tabbar[hidden]){grid-template-columns:1fr}
  #view{grid-column:2;grid-row:1;min-width:0}
  .phone:has(>#tabbar[hidden]) #view{grid-column:1}
  .tabbar{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:2px;padding:24px 14px;border-top:0;border-right:1px solid var(--line);background:var(--bg)}
  .tb-brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px;font-size:19px;letter-spacing:-.03em}
  .tb-brand .appicon.sm{width:32px;height:32px;border-radius:10px}
  .tabbar button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:12px;font-size:15px;font-weight:600}
  .tabbar button .ic{width:22px;height:22px}
  .tabbar button:hover{background:var(--surface);color:var(--ink)}
  .tabbar button.on{background:var(--surface)}
  .scrim{position:fixed}
  .sheet{position:fixed;left:50%;right:auto;top:50%;bottom:auto;width:min(560px,calc(100vw - 48px));max-height:min(86vh,860px);border-radius:24px;overflow:hidden;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .25s ease,opacity .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
}

ading posts…":"글을 불러오는 중…","Could not load posts":"글을 불러오지 못했어요","Check your connection and try again.":"인터넷 연결을 확인하고 다시 시도해 주세요.","Try again":"다시 시도","Log in to write a post":"로그인하면 글을 쓸 수 있어요","Log in to like posts":"로그인하면 좋아요를 누를 수 있어요","Delete this post?":"이 글을 삭제할까요?","Hide all posts from this writer":"이 사람의 글 모두 숨기기","Posts from this writer are hidden on this device":"이 사람의 글을 이 기기에서 숨겼어요","Me":"나","Anonymous":"익명","Profile photo":"프로필 사진","Choose a photo":"사진 선택","Change photo":"사진 바꾸기","Remove photo":"사진 삭제","Shown on your profile, your own posts and the mentor reviews you write.":"프로필, 내가 쓴 글, 내가 쓴 멘토 후기에 보여요.","Profile photo updated":"프로필 사진을 바꿨어요","Profile photo removed":"프로필 사진을 삭제했어요","This photo could not be resized. Try another one.":"사진 크기를 맞추지 못했어요. 다른 사진을 골라 주세요.","This file could not be read. Choose a JPEG (.jpg) photo.":"사진을 읽을 수 없어요. JPEG(.jpg) 사진을 골라 주세요.","Only JPEG (.jpg) photos can be used.":"JPEG(.jpg) 사진만 올릴 수 있어요.","This photo is too large. Choose one under 10 MB.":"사진이 너무 커요. 10MB 이하 사진을 골라 주세요.","JPEG (.jpg) only, up to 10 MB. The center is cropped to a square and saved as 320 × 320.":"JPEG(.jpg) 사진만, 10MB까지 올릴 수 있어요. 가운데를 정사각형으로 잘라 320×320으로 저장해요.","Notifications":"알림","Off":"꺼짐","On · deadline reminders and review results":"켜짐 · 마감 알림, 심사 결과","Turn on notifications?":"알림을 받을까요?","We remind you 3 days and 1 day before each checklist deadline at 9 AM, and tell you when your mentor review is decided. You can change this any time in Me.":"체크리스트 마감 3일 전·1일 전 오전 9시에 알려드리고, 멘토 심사 결과도 바로 알려드려요. 마이 탭에서 언제든 바꿀 수 있어요.","Turn on notifications":"알림 켜기","Not now":"나중에","Notifications are on":"알림을 켰어요","Notifications are off":"알림을 껐어요","Notifications are blocked. Turn them on in your phone settings.":"알림이 차단돼 있어요. 휴대폰 설정에서 교환가자 알림을 허용해 주세요.","Open your checklist and mark it done when finished.":"체크리스트에서 확인하고 완료로 표시하세요.","Invite friends":"친구에게 교환가자 알려주기","Delete account":"회원 탈퇴","Delete my account":"탈퇴하기","Password":"비밀번호","Enter your password.":"비밀번 fer check":"예: 수강 계획 검토와 학점 인정 점검","Korean student community · No members yet":"한인 학생 커뮤니티 · 아직 멤버가 없어요","No messages yet":"아직 메시지가 없어요","No posts yet":"아직 글이 없어요","Be the first to share a tip or ask a question.":"첫 번째로 팁을 나누거나 질문을 올려 보세요.","Join to write the first post.":"가입하고 첫 글을 써 보세요.","Going soon":"참여 예정","There now":"재학 중","Completed":"수료","Find your university’s Korean student community":"파견 대학 한인 학생 커뮤니티 찾기","My university":"내 파견교","Board":"게시판","Join to open the chat":"가입하면 채팅이 열려요","The group chat is only for members of this community.":"단체 채팅은 이 커뮤니티 멤버만 이용할 수 있어요.","Share a tip or ask a question":"팁을 나누거나 질문을 올려 보세요","Post":"올리기","Posted":"올렸어요","Message everyone":"모두에게 메시지","Partners of Korean universities":"한국 대학 협정교","Canada · Mexico":"캐나다·멕시코","HUFS":"한국외대","Kwangwoon":"광운대","Sangmyung":"상명대","Sahmyook":"삼육대","SKHU":"성공회대","Hanyang":"한양대","Chungbuk":"충북대","Gyeongsang":"경상국립대","Jeonbuk":"전북대","Kangwon":"강원대","New Zealand":"뉴질랜드","Mexico":"멕시코","Official host page":"파견교 공식 페이지","Source":"출처","Open the official page":"공식 페이지 열기","Check the current dates and documents before you act. Hosts update them every term.":"진행하기 전에 최신 일정과 서류를 확인하세요. 학기마다 바뀌어요.","Your home international office":"본교 국제처","Get an English bank statement":"영문 잔고증명서 받기","Use":"사용","Keep":"보관","Ask":"문의","Upload documents":"서류 업로드하기","Processing":"처리 기간","$350 (F-1)":"$350 (F-1)","$220 (J-1)":"$220 (J-1)","30 days before I-20 start date":"I-20 시작일 30일 전","30 days before DS-2019 start date":"DS-2019 시작일 30일 전","A few days after arrival, check your I-94 record shows J-1 and D/S. Report errors right away.":"도착 며칠 뒤 I-94 기록에 J-1와 D/S가 표시되는지 확인하세요. 오류가 있으면 바로 신고하세요.","After admission, the international student office opens an DS-2019 request in your applicant portal.":"합격 후 국제학생처가 지원자 포털에 DS-2019 요청을 열어줘요.","After you register, Harvard asks every student who needs an I-20 to fill out the International Student Questionnaire.":"과목 등록 후, I-20이 필요한 모든 학생은 International Student Questionnaire를 작성해야 해요.","After you register, Harvard asks every student who needs an DS-2019 to fill out the International Student Questionnaire.":"과목 등록 후, DS-2019이 필요한 모든 학생은 International Student Questionnaire를 작성해야 해요.","Check and sign your DS-2019":"DS-2019 확인하고 서명하기","Download the DS-2019":"DS-2019 내려받기","Enter your SEVIS ID and the school name and address from your DS-2019.":"DS-2019에 있는 SEVIS ID와 학교 이름·주소를 입력하세요.","Enter your DS-2019 details":"DS-2019 정보 입력하기","Every J-1 student pays the I-901 SEVIS fee before the visa interview. It takes about 10 minutes online.":"모든 J-1 학생은 비자 인터뷰 전에 I-901 SEVIS 비용을 내요. 온라인으로 10분 정도 걸려요.","Find the DS-2019 request form":"DS-2019 요청서 찾기","For an I-20 you need full-time, on-campus credit: 8 credits in the 7-week session or 4 credits in the 4-week session. Online, hybrid and study abroad courses do not count.":"I-20을 받으려면 캠퍼스 수업으로 정규 학점을 채워야 해요. 7주 세션은 8학점, 4주 세션은 4학점이에요. 온라인·하이브리드·해외 프로그램 수업은 인정되지 않아요.","For an DS-2019 you need full-time, on-campus credit: 8 credits in the 7-week session or 4 credits in the 4-week session. Online, hybrid and study abroad courses do not count.":"DS-2019을 받으려면 캠퍼스 수업으로 정규 학점을 채워야 해요. 7주 세션은 8학점, 4주 세션은 4학점이에요. 온라인·하이브리드·해외 프로그램 수업은 인정되지 않아요.","MRV fee, $185 for J-1 (check for any additional fees)":"MRV 비용, J-1 $185 (추가 비용 여부 확인)","Most hosts email the I-20 as a PDF within 1–3 weeks.":"대부분 1~3주 안에 I-20을 PDF로 이메일로 보내줘요.","Most hosts email the DS-2019 as a PDF within 1–3 weeks.":"대부분 1~3주 안에 DS-2019을 PDF로 이메일로 보내줘요.","Name as on DS-2019":"DS-2019에 적힌 이름","Passport with J-1 visa":"J-1 비자가 붙은 여권","Pay $220 by card":"카드로 $220 결제하기","Pay the I-901 SEVIS fee ($220)":"I-901 SEVIS 비용 내기 ($220)","Request your DS-2019":"DS-2019 요청하기","SEVIS ID and school code from the DS-2019":"DS-2019의 SEVIS ID와 학교 코드","Select the DS-2019 (J-1) form and type the information exactly as printed on your DS-2019.":"DS-2019 (J-1) 양식을 고르고 DS-2019에 인쇄된 그대로 입력하세요.","Signed DS-2019":"서명한 DS-2019","The CBP officer admits you as J-1 “D/S”.":"입국심사관이 J-1 “D/S”로 입국을 허가해요.","The host checks that you can pay for your stay before it issues your I-20. The U.S. consulate may ask for the same documents at your interview.":"파견교는 I-20을 발급하기 전에 체류 비용을 낼 수 있는지 확인해요. 비자 인터뷰에서도 같은 서류를 요구할 수 있어요.","The host checks that you can pay for your stay before it issues your DS-2019. The U.S. consulate may ask for the same documents at your interview.":"파견교는 DS-2019을 발급하기 전에 체류 비용을 낼 수 있는지 확인해요. 비자 인터뷰에서도 같은 서류를 요구할 수 있어요.","The DS-2019 is the document your whole J-1 visa is built on. Check every detail before you pay any fees, and sign it.":"DS-2019은 J-1 비자의 기본 서류예요. 비용을 내기 전에 모든 내용을 확인하고 서명하세요.","Upload your documents to the I-20 portal":"I-20 서류 포털에 업로드하기","Upload your documents to the DS-2019 portal":"DS-2019 서류 포털에 업로드하기","Upload your passport and proof of funds to Harvard’s I-20 document portal. Processing takes about two to three weeks. Use the same financial documents at your visa interview.":"하버드 I-20 서류 포털에 여권과 재정 증빙을 올리세요. 처리에 2~3주 걸려요. 비자 인터뷰에도 같은 재정 서류를 쓰세요.","Upload your passport and proof of funds to Harvard’s DS-2019 document portal. Processing takes about two to three weeks. Use the same financial documents at your visa interview.":"하버드 DS-2019 서류 포털에 여권과 재정 증빙을 올리세요. 처리에 2~3주 걸려요. 비자 인터뷰에도 같은 재정 서류를 쓰세요.","Wait for the DS-2019":"DS-2019 기다리기","When the passport arrives, check that the visa says J-1 and your name and SEVIS ID are correct.":"여권을 받으면 비자에 J-1로 적혀 있고 이름과 SEVIS ID가 맞는지 확인하세요.","You can enter the U.S. up to 30 days before the program start date on your I-20. After landing, check your I-94 record and complete check-in with the international office.":"I-20에 적힌 프로그램 시작일 30일 전부터 미국에 입국할 수 있어요. 도착 후 I-94 기록을 확인하고 국제학생처 체크인을 마치세요.","You can enter the U.S. up to 30 days before the program start date on your DS-2019. After landing, check your I-94 record and complete check-in with the international office.":"DS-2019에 적힌 프로그램 시작일 30일 전부터 미국에 입국할 수 있어요. 도착 후 I-94 기록을 확인하고 국제학생처 체크인을 마치세요.","You need the DS-2019 at the interview, at the border, and when you travel in and out of the U.S.":"DS-2019은 인터뷰, 입국심사, 미국 출입국 때마다 필요해요.","Your J-1 visa starts with the DS-2019, which the host issues after checking that you can pay for your stay. Submit the DS-2019 request with proof of funds in the host portal.":"J-1 비자는 DS-2019에서 시작해요. 파견교가 체류 비용 지불 능력을 확인한 뒤 발급해요. 파견교 포털에서 재정 증빙과 함께 DS-2019을 요청하세요.","J-1 student":"J-1 학생","J-1, D/S (duration of status)":"J-1, D/S (체류 자격 유지 기간)","2026 deadline":"2026년 마감","4 credits, on campus":"캠퍼스 수업 4학점","4-week session":"4주 세션","7-week session":"7주 세션","8 credits, on campus":"캠퍼스 수업 8학점","About 2–3 weeks":"약 2~3주","Account holder’s name matching the sponsor":"후원자와 같은 예금주 이름","Add a sponsor letter if needed":"필요하면 후원 확인서 추가하기","Amount":"금액","Approve with":"승인","April 20 (2027 dates are announced when registration opens)":"4월 20일 (2027년 일정은 등록 시작 때 공지)","April 23":"4월 23일","April 30":"4월 30일","Ask for":"요청할 것","Ask your bank for an English balance certificate issued within the last few months, in KRW or USD.":"은행에서 최근 몇 달 안에 발급한 영문 잔고증명서(원화 또는 달러)를 받으세요.","Ask your bank for an English balance certificate. Some countries need it issued within the last month.":"은행에서 영문 잔고증명서를 받으세요. 한 달 이내 발급본을 요구하는 나라도 있어요.","Ask your home office":"본교 국제처에 확인하기","Before this":"먼저 필요한 것","Browse the course list":"과목 목록 살펴보기","Check eligibility for international students and the deadline.":"국제학생 지원 자격과 마감일을 확인하세요.","Check the amount and deadline":"금액과 마감일 확인하기","Check the host’s deadlines":"파견교 마감일 확인하기","Check the visa course load":"비자에 필요한 수강 학점 확인하기","Choose courses and get credit pre-approval":"과목 고르고 학점 인정 사전승인 받기","Choose on-campus courses for a full-time load":"정규 학점을 채울 캠퍼스 수업 고르기","Complete the International Student Questionnaire":"International Student Questionnaire 작성하기","Confirm the date your nomination was sent and the email address it went to.":"추천서를 보낸 날짜와 받는 이메일 주소를 확인하세요.","Course titles and codes":"과목명과 코드","Create your DCEKey":"DCEKey 만들기","Create your DCEKey and MyDCE account":"DCEKey와 MyDCE 계정 만들기","Create your MyDCE student account":"MyDCE 학생 계정 만들기","Credits (ECTS, units)":"학점 (ECTS 등)","Credits or hours":"학점 또는 시간","DCEKey first, then MyDCE":"DCEKey 먼저, 그다음 MyDCE","Deadlines and document requests arrive by email. Add the program’s address to your contacts so it does not go to spam.":"마감일과 서류 요청은 이메일로 와요. 스팸함으로 가지 않게 프로그램 주소를 연락처에 추가하세요.","Does not count":"인정 안 됨","Done by":"담당","Download the receipt PDF. A late payment can cancel your registration.":"영수증 PDF를 내려받으세요. 늦게 내면 등록이 취소될 수 있어요.","Draft your course list (study plan)":"수강 계획서 작성하기","English bank balance certificate":"영문 잔고증명서","English proficiency approved":"영어 능력 승인 완료","English, recent bank certificate":"최근 발급한 영문 은행 증명서","English, recent, with bank seal":"영문, 최근 발급, 은행 직인","Enter your English name exactly as in your passport. Use an email you check every day.":"여권과 똑같이 영문 이름을 입력하세요. 매일 확인하는 이메일을 쓰세요.","Every later step, from course registration to visa documents, happens in this account. Set it up first.":"과목 등록부터 비자 서류까지 모든 단계가 이 계정에서 진행돼요. 가장 먼저 만드세요.","Exchange Visitor (J1)":"Exchange Visitor (J1)","Family relation certificate (in English)":"영문 가족관계증명서","Find the amount you must show":"보여야 할 금액 확인하기","Find the required amount":"필요한 금액 확인하기","Find the visiting or international student section and the account sign-up link.":"방문·국제학생 메뉴에서 계정 만들기 링크를 찾으세요.","For purpose of trip, choose “Exchange Visitor Visa (J)” then “Exchange Visitor (J1)”. Use the host’s address as your U.S. address.":"방문 목적은 “Exchange Visitor Visa (J)”와 “Exchange Visitor (J1)”를 고르세요. 미국 주소는 파견교 주소를 쓰세요.","Format":"형식","Get an English bank certificate":"영문 은행 증명서 받기","Get credit pre-approval":"학점 인정 사전승인 받기","Home department or international office":"본교 학과나 국제처","Host course catalogue for exchange students":"교환학생용 파견교 과목 목록","Hosts set separate nomination and application deadlines.":"파견교는 추천 마감과 지원 마감을 따로 정해요.","If a parent pays":"부모님이 낼 경우","If a parent pays, add a signed letter of support and their bank certificate.":"부모님이 내면 서명한 후원 확인서와 부모님 은행 증명서를 더하세요.","It appears in MyDCE after you register for eligible on-campus courses.":"조건에 맞는 캠퍼스 수업을 등록하면 MyDCE에 나타나요.","Join the email list":"이메일 소식 받기","Keep the confirmation email. You will need your student ID for the visa steps.":"확인 이메일을 보관하세요. 비자 단계에서 학번이 필요해요.","List 2–3 backups":"대체 과목 2~3개 준비","Log in with your DCEKey and complete the student account with your passport name and contact details.":"DCEKey로 로그인해 여권 이름과 연락처로 학생 계정을 완성하세요.","Login email and password":"로그인 이메일과 비밀번호","Most hosts ask for a course list with your application. Check the host’s course catalogue for exchange students, and have your home department approve the credit.":"대부분 지원서와 함께 수강 계획을 받아요. 교환학생용 과목 목록을 확인하고 본교 학과에서 학점 인정을 승인받으세요.","Must take a full-time, in-person load":"정규 학점을 대면 수업으로 들어야 함","Note the session dates, credits and whether each course is in person or online.":"세션 날짜, 학점, 대면·온라인 여부를 메모하세요.","Online, hybrid, study abroad":"온라인, 하이브리드, 해외 프로그램","Only courses open to exchange students count. Note the language of instruction.":"교환학생에게 열린 과목만 들을 수 있어요. 수업 언어도 확인하세요.","Open the application":"지원서 열기","Open the exchange course catalogue":"교환학생 과목 목록 열기","Open the login page and choose “New to DCE?”. You are asked to create a DCEKey login first.":"로그인 페이지에서 “New to DCE?”를 누르세요. 먼저 DCEKey 로그인을 만들라고 나와요.","Open the program site":"프로그램 사이트 열기","Open the questionnaire":"설문 열기","Order":"순서","Overseas-enabled card or bank transfer":"해외 결제 카드 또는 계좌이체","Pay and save the receipt":"결제하고 영수증 보관하기","Pay the program fee and deposit":"프로그램 비용과 보증금 내기","Pay with":"결제 수단","Pick courses before you register. Ask your home department which ones will transfer as credit, and keep backups in case a class fills up.":"등록 전에 과목을 고르세요. 어떤 과목이 학점으로 인정되는지 본교 학과에 묻고, 마감될 때를 대비해 대체 과목도 준비하세요.","Prerequisites, class times, credits":"선수과목, 수업 시간, 학점","Questions":"문의","Receipt for your records and visa interview":"기록과 비자 인터뷰용 영수증","Register for your courses in MyDCE":"MyDCE에서 과목 등록하기","Register through DCE Course Search and Registration. Harvard says all deadlines are strict and late registration is not allowed. Your English proficiency must be approved before you can register.":"DCE Course Search and Registration에서 등록하세요. 하버드는 모든 마감이 엄격하고 늦은 등록은 받지 않는다고 해요. 영어 능력이 승인되어야 등록할 수 있어요.","Registration dates for Summer 2027 are announced by email.":"2027년 여름 등록 일정은 이메일로 공지돼요.","Right after course registration":"과목 등록 직후","Send course descriptions to your home department and keep their approval in writing.":"과목 설명을 본교 학과에 보내고 승인을 서면으로 받아두세요.","Send descriptions to your home department and keep their approval.":"과목 설명을 본교 학과에 보내고 승인을 받아두세요.","Sign up with your passport name":"여권 이름으로 가입하기","Signed sponsor letter":"서명한 후원 확인서","Sponsor letter plus their certificate":"후원 확인서와 후원자 증명서","Sponsor letter plus their statement":"후원 확인서와 후원자 잔고증명","Sponsor’s bank certificate":"후원자 은행 증명서","Statement or CV (if asked)":"자기소개서나 이력서 (요청 시)","Student visas and residence permits ask you to show you can pay for your stay. Get the documents ready before you apply.":"학생비자와 체류허가는 체류 비용을 낼 수 있음을 보여야 해요. 신청 전에 서류를 준비하세요.","Students who need a student visa must usually take a full-time load of in-person courses. Online courses rarely count.":"학생비자가 필요한 학생은 보통 대면 수업으로 정규 학점을 채워야 해요. 온라인 수업은 거의 인정되지 않아요.","Submit and save the confirmation":"제출하고 확인 메일 보관하기","Syllabus or description":"강의계획서나 과목 설명","The date it was sent":"보낸 날짜","The host’s estimated cost for your program":"파견교가 안내한 예상 비용","The international office lists the estimated cost (tuition, housing, living) you must show.":"국제처가 보여야 할 예상 비용(학비·숙소·생활비)을 안내해요.","The visa rules or the host’s international office state the minimum per month or per year.":"비자 규정이나 파견교 국제처가 월별·연간 최소 금액을 안내해요.","Then":"그다음","Tip":"팁","Tuition, application and housing deposits are often due on different dates.":"학비, 지원비, 숙소 보증금은 마감일이 서로 다른 경우가 많아요.","Turn on email alerts":"이메일 알림 켜기","Visa students":"비자 필요 학생","Watch for the host’s application email":"파견교 지원 안내 메일 기다리기","Your home department":"본교 학과","Your name exactly as in your passport":"여권과 똑같은 이름","Your place is usually held only after payment. Pay by the deadline with a card that works overseas, and keep the receipt.":"보통 결제해야 자리가 확정돼요. 해외 결제 카드로 마감 전에 내고 영수증을 보관하세요.","CoE":"CoE","Penn Summer · International students":"Penn Summer · 국제학생","LSE Summer School 2027 brochure (PDF)":"LSE Summer School 2027 브로슈어 (PDF)","Leeds International Summer School · Applying":"Leeds International Summer School · 지원","new scale":"새 점수 체계","CityUHK · Inbound exchange programmes":"CityUHK · 인바운드 교환 프로그램","or 5 on the new scale":"또는 새 점수 체계 5","ANU Policy · English language admission requirements":"ANU 규정 · 영어 입학 요건","6.0 in each band":"영역별 6.0 이상","UChicago does not issue student visas for summer. Students who are not enrolled at a U.S. university can take online courses only.":"UChicago는 서머 학생비자를 발급하지 않아요. 미국 대학 재학생이 아니면 온라인 수업만 들을 수 있어요.","International undergraduates join the Penn Summer Global Institute: 6 weeks, two courses and housing included.":"해외 학부생은 Penn Summer Global Institute로 참여해요. 6주, 2과목, 기숙사 포함이에요.","Only students nominated by a King’s partner university can apply to the Undergraduate Summer School.":"King’s 협정교의 추천을 받은 학생만 학부 서머스쿨에 지원할 수 있어요.","Dauphine’s summer schools are held at its London campus, not in Paris.":"Dauphine 서머스쿨은 파리가 아니라 런던 캠퍼스에서 열려요.","Courses are offered in English and French. Both need a B2 level.":"수업은 영어와 프랑스어로 열리고, 둘 다 B2 수준이 필요해요.","The Sorbonne Summer University teaches French language and culture.":"소르본 서머 유니버시티는 프랑스어와 프랑스 문화를 가르쳐요.","Most courses and exams are in French. Exchange students need French at B2.":"대부분의 수업과 시험이 프랑스어예요. 교환학생은 프랑스어 B2가 필요해요.","The International Summer School teaches German language and culture.":"국제 서머스쿨은 독일어와 독일 문화를 가르쳐요.","Oxford has no open summer school for undergraduates. Summer courses run through Lifelong Learning or partner programs.":"옥스퍼드에는 학부생 누구나 지원하는 서머스쿨이 없어요. 서머 과정은 Lifelong Learning이나 제휴 프로그램으로 운영돼요.","Oxford takes visiting students through individual colleges, usually for a full academic year.":"옥스퍼드는 각 칼리지를 통해 방문학생을 받으며, 보통 1년 과정이에요.","Bachelor’s courses are taught mainly in German. Most English-taught courses are at Master’s level.":"학부 수업은 주로 독일어예요. 영어 수업은 대부분 석사 과정에 있어요.","Most programs require French at B2. English is not an entry requirement.":"대부분의 과정이 프랑스어 B2를 요구해요. 영어는 입학 요건이 아니에요.","Most courses are taught in Spanish, and B1 Spanish is advised. English-taught places are limited.":"대부분 스페인어로 수업해요. 스페인어 B1을 권장하고, 영어 수업은 자리가 적어요.","Spanish B1 is expected, and B2 English for English-taught courses.":"스페인어 B1이 필요하고, 영어 수업은 영어 B2가 필요해요.","The School of International Service takes undergraduate exchange students from Korea University, Ritsumeikan and Sciences Po. Ask your office about other agreements.":"국제관계대학(SIS)은 고려대, 리쓰메이칸, 시앙스포 학생만 학부 교환으로 받아요. 다른 협정은 본교 국제처에 확인하세요.","LSE has no one-semester exchange. Visiting students join the full-year General Course.":"LSE에는 한 학기 교환이 없어요. 방문학생은 1년 과정인 General Course로 참여해요.","Some faculties need Japanese (JLPT N1 or N2). Global Management teaches in English.":"일부 학부는 일본어(JLPT N1 또는 N2)가 필요해요. 국제경영학부는 영어로 수업해요.","A two-week Japanese language program for students at JLPT N3 to N2 level.":"JLPT N3~N2 수준 학생을 위한 2주 일본어 프로그램이에요.","Five-week Japanese language and culture program. Basic English or Japanese is enough.":"5주 일본어·문화 프로그램이에요. 기초 영어나 일본어면 충분해요.","Most partner students need no language certificate. B2 in German or English is expected.":"협정교 학생은 대부분 어학 증명이 필요 없어요. 독일어나 영어 B2 수준이 기대돼요.","No language certificate is needed, but B2 English is expected. Housing is limited, so apply in the first window.":"어학 증명은 필요 없지만 영어 B2 수준이 기대돼요. 숙소가 부족하니 첫 신청 기간에 지원하세요.","Exchange students can also come for the Special Term (May to July).":"교환학생은 스페셜 텀(5~7월)으로도 갈 수 있어요.","UNSW also runs Summer (January) and Winter (August) Tailored Terms for exchange students.":"UNSW는 교환학생을 위한 여름(1월)·겨울(8월) 단기 학기도 운영해요.","Students from partner universities can join tuition-free when their home university nominates them.":"협정교 학생은 본교 추천을 받으면 수업료 없이 참여할 수 있어요.","Partner-university students join as exchange students and pay tuition to their home university.":"협정교 학생은 교환학생으로 참여하고 수업료는 본교에 내요.","Housing is reserved for only about 25% of incoming students. Start looking at least 3 months ahead.":"학교가 확보한 숙소는 들어오는 학생의 약 25%분뿐이에요. 최소 3개월 전부터 구하세요.","Non-EU exchange students get a guaranteed room offer. Accept it on Roomspot before the deadline.":"비EU 교환학생은 방 제공이 보장돼요. 마감 전에 Roomspot에서 수락하세요.","UW Study Abroad · Visiting & exchange application":"UW Study Abroad · 방문·교환학생 지원","UTokyo Global Unit Courses (summer)":"UTokyo Global Unit Courses (여름)","Taught in English. You need at least one term of university study.":"영어로 수업해요. 대학에서 최소 한 학기를 마쳐야 해요.","UTokyo · Global Unit Courses summer program":"UTokyo · Global Unit Courses 여름 프로그램","Waseda CIE · Exchange requirements, A.Y. 2027 (PDF)":"Waseda CIE · 2027학년도 교환 요건 (PDF)","Harvard Summer School, college and adult students":"Harvard Summer School, 대학생·성인 과정","Stanford Summer Session, international college students":"Stanford Summer Session, 해외 대학생","These are strict minimums. Scores stay valid for 3 years.":"엄격한 최소 기준이에요. 점수는 3년간 유효해요.","Stanford Summer Session · International students":"Stanford Summer Session · 국제학생","Yale Summer Session, visiting international students":"Yale Summer Session, 해외 방문학생","Yale Summer Session · Visiting international students":"Yale Summer Session · 해외 방문학생","105+ is competitive":"105 이상이면 경쟁력 있음","8.0+ is competitive":"8.0 이상이면 경쟁력 있음","130+ is competitive":"130 이상이면 경쟁력 있음","100+ is competitive":"100 이상이면 경쟁력 있음","Columbia Summer, visiting students":"Columbia Summer, 방문학생","Scores are valid for 2 years. TOEFL MyBest scores are not accepted.":"점수는 2년간 유효해요. TOEFL MyBest 점수는 인정하지 않아요.","Columbia Summer · Application materials":"Columbia Summer · 제출 서류","7.5 preferred":"7.5 권장","A 6-week program for international undergraduates. Two courses and housing are included.":"해외 학부생을 위한 6주 과정이에요. 2과목과 기숙사가 포함돼요.","UChicago Summer Session, visiting students":"UChicago Summer Session, 방문학생","UChicago does not issue student visas for summer. Students outside U.S. universities take online courses only.":"UChicago는 서머 학생비자를 발급하지 않아요. 미국 대학 재학생이 아니면 온라인 수업만 들을 수 있어요.","UChicago Summer Session · International students":"UChicago Summer Session · 국제학생","guideline":"권장 기준","UC San Diego Summer Session, international students":"UC San Diego Summer Session, 국제학생","Needed for your I-20. Online-only students studying from abroad are exempt.":"I-20 발급에 필요해요. 해외에서 온라인으로만 듣는 학생은 면제예요.","UC San Diego Summer Session · Eligibility":"UC San Diego Summer Session · 지원 자격","NYU Visiting Student Program":"NYU 방문학생 프로그램","English proof is required unless you studied 3+ years in English. The international deadline is March 15.":"영어로 3년 이상 공부하지 않았다면 영어 증명이 필요해요. 국제학생 마감은 3월 15일이에요.","NYU · Visiting students, how to apply":"NYU · 방문학생 지원 방법","No minimum":"최소 기준 없음","Not needed if you studied at university level in English. Tests must be from the past 2 years.":"대학 과정을 영어로 공부했다면 필요 없어요. 시험은 2년 이내여야 해요.","LSE Summer School · English language requirements":"LSE Summer School · 영어 요건","25 in each part":"영역별 25 이상","7.0 in every part":"모든 영역 7.0 이상","7.0 in all four parts":"네 영역 모두 7.0 이상","General Course (full-year visiting study)":"General Course (1년 방문 과정)","Scores are not part of selection. You need them only after you get an offer.":"점수는 선발 기준이 아니에요. 합격한 뒤에만 제출하면 돼요.","UCL Summer School, most modules":"UCL Summer School, 대부분의 과목","Some modules accept IELTS 6.5. Tests must be from the past 2 years.":"일부 과목은 IELTS 6.5도 인정해요. 시험은 2년 이내여야 해요.","UCL Summer School · Entry requirements":"UCL Summer School · 지원 요건","6.5 in each part":"영역별 6.5 이상","new scale, 4.5 in each part":"새 점수 체계, 영역별 4.5 이상","Only students nominated by a King’s partner university can apply.":"King’s 협정교의 추천을 받은 학생만 const STOP=new Set(['of','the','and','for','at','in','de','des','du','la','le','der','die','das','für','di','del','y','&','The','an','a','und','et']);
function monoOf(n){
  const p=n.match(/\(([A-Z]{2,5})\)/); if(p) return p[1];
  const w=n.replace(/[(),.\-–/]/g,' ').split(/\s+/).filter(Boolean);
  const cap=w.find(x=>/^[A-Z]{2,5}$/.test(x)); if(cap) return cap;
  const s=w.filter(x=>!STOP.has(x)&&/^[A-Za-zÀ-ž]/.test(x)).map(x=>x[0].toUpperCase()).join('');
  return (s||n.slice(0,2)).slice(0,4);
}

async function api(path,data){
  const headers=NATIVE?{'X-GG-Client':'app',...(TOKEN.get()?{Authorization:'Bearer '+TOKEN.get()}:{})}:{};
  const cred=NATIVE?'omit':'same-origin';
  const opt=data===undefined?{credentials:cred,headers}:{method:'POST',credentials:cred,headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(data)};
  let r; try{r=await fetch(BASE+'/api/'+path,opt)}catch(e){throw Object.assign(new Error('network'),{code:'network'})}
  let j={}; try{j=await r.json()}catch(e){}
  if(NATIVE&&j&&j.token) TOKEN.set(j.token);
  if(NATIVE&&r.status===401&&j.error==='login_required') TOKEN.set('');
  if(!r.ok) throw Object.assign(new Error(j.error||'error'),{code:j.error||(r.status===404?'not_configured':'network'),left:j.left});
  return j;
}

async function loadMe(){try{const j=await api('me');AUTH.configured=j.configured!==false;AUTH.user=j.user||null}catch(e){AUTH.configured=false}AUTH.ready=true}
async function loadData(){
  const me=loadMe();
  const st=fetch(BASE+(BASE?'/':'')+'data/status.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{STATUS=j}).catch(()=>{});
  try{
    const r=await fetch(BASE+(BASE?'/':'')+'data/universities.json',{cache:'no-cache'}); DATA=await r.json(); COUNTRIES=DATA.countries; buildNameKo(COUNTRIES);
  }catch(e){ DATA={unis:[],kr:[],countries:COUNTRIES,error:true}; }
  await st; await me; setTimeout(loadKRM,1200);  // Korean university names for profiles and posts
  if(!AUTH.user){ try{const g=JSON.parse(localStorage.getItem('gg_profile')||'null'); if(g&&g.univ){S.profile.univ=g.univ; if(g.major) S.profile.major=g.major; if(g.year) S.profile.year=g.year}}catch(e){} try{restoreComm(JSON.parse(localStorage.getItem('gg_comm')||'[]'))}catch(e){} }
  if(['boot','lang','splash','login'].includes(S.screen)){
    if(AUTH.user){ const had=restoreUser(AUTH.user); NAV.replaceNext=true; S.screen=had?'app':'profile'; S.tab='home'; }
    else if(S.screen==='boot'){ hintIn(false); NAV.replaceNext=true; S.screen='splash' }
  }
  render(true);
  // a shared post link (?post=<id>) opens that post
  try{ if(new URLSearchParams(location.search).get('go')==='sessions'&&AUTH.user){ S.screen='sessions'; SESS.at=0; render(); history.replaceState(history.state,'',location.pathname) } }catch(e){}
  try{ const pid=new URLSearchParams(location.search).get('post'); if(pid&&/^[a-z0-9]{6,20}$/.test(pid)){ if(S.screen==='app'){S.tab='community'; render()} openPost(pid); history.replaceState(history.state,'',location.pathname) } }catch(e){}
}

const HOST_NOTE={"University of Chicago": {"ss": "UChicago does not issue student visas for summer. Students who are not enrolled at a U.S. university can take online courses only."}, "University of Pennsylvania": {"ss": "International undergraduates join the Penn Summer Global Institute: 6 weeks, two courses and housing included."}, "King's College London, University of London": {"ss": "Only students nominated by a King’s partner university can apply to the Undergraduate Summer School."}, "Université Paris-Dauphine (Paris IX)": {"ss": "Dauphine’s summer schools are held at its London campus, not in Paris.", "ex": "Courses are offered in English and French. Both need a B2 level."}, "Université Paris-Sorbonne (Paris IV)": {"ss": "The Sorbonne Summer University teaches French language and culture.", "ex": "Most courses and exams are in French. Exchange students need French at B2."}, "Ruprecht-Karls-Universität Heidelberg": {"ss": "The International Summer School teaches German language and culture."}, "University of Oxford": {"ss": "Oxford has no open summer school for undergraduates. Summer courses run through Lifelong Learning or partner programs.", "ex": "Oxford takes visiting students through individual colleges, usually for a full academic year."}, "ETHZ - ETH Zurich": {"ex": "Bachelor’s courses are taught mainly in German. Most English-taught courses are at Master’s level."}, "Université de Montréal": {"ex": "Most programs require French at B2. English is not an entry requirement."}, "Universidad de Málaga": {"ex": "Most courses are taught in Spanish, and B1 Spanish is advised. English-taught places are limited."}, "Universidad Autónoma de Madrid": {"ex": "Spanish B1 is expected, and B2 English for English-taught courses."}, "American University": {"ex": "The School of International Service takes undergraduate exchange students from Korea University, Ritsumeikan and Sciences Po. Ask your office about other agreements."}, "London School of Economics and Political Science, University of London": {"ex": "LSE has no one-semester exchange. Visiting students join the full-year General Course."}, "Chuo University": {"ex": "Some faculties need Japanese (JLPT N1 or N2). Global Management teaches in English."}, "Meiji University": {"ss": "A two-week Japanese language program for students at JLPT N3 to N2 level."}, "Ritsumeikan University": {"ss": "Five-week Japanese language and culture program. Basic English or Japanese is enough."}, "Universität Mannheim": {"ex": "Most partner students need no language certificate. B2 in German or English is expected."}, "Uppsala University": {"ex": "No language certificate is needed, but B2 English is expected. Housing is limited, so apply in the first window."}, "National University of Singapore": {"ex": "Exchange students can also come for the Special Term (May to July)."}, "University of New South Wales": {"ex": "UNSW also runs Summer (January) and Winter (August) Tailored Terms for exchange students."}, "Fudan University": {"ss": "Students from partner universities can join tuition-free when their home university nominates them."}, "The Chinese University of Hong Kong": {"ss": "Partner-university students join as exchange students and pay tuition to their home university."}, "Erasmus University Rotterdam": {"ex": "Housing is reserved for only about 25% of incoming students. Start looking at least 3 months ahead."}, "University of Twente": {"ex": "Non-EU exchange students get a guaranteed room offer. Accept it on Roomspot before the deadline."}};
const hostNote=(h,p)=>(HOST_NOTE[h.name]||{})[p.long?'ex':'ss']||'';
const NO_SUMMER=new Set(['University of Helsinki','University of Southern California','Technische Universität München','ETHZ - ETH Zurich','Chuo University','Hitotsubashi University','National University of Singapore']);
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
function programsOf(h){ // not every host offers every program type
  const x=hash(h.name);
  return PROGRAMS.filter(p=>!(p.id==='visit'&&x%3===0)&&!(p.id==='ws'&&x%4===1)&&!(p.id==='ss'&&NO_SUMMER.has(h.name)));
}
function depOf(p,h){
  const na=h.region==='us'||h.cc==='CA', jp=h.cc==='JP';
  if(h.region==='oceania'){ // Australian year: Semester 1 from late Feb, Semester 2 from late July; summer/winter terms fit Korean breaks
    if(p.season==='spring') return '2027-02-13';
    if(p.season==='fall') return '2027-07-10';
    if(p.season==='summer') return '2027-06-26';
    return '2027-01-02';
  }
  if(p.season==='spring') return na?'2027-01-03':h.region==='europe'?'2027-01-30':jp?'2027-03-28':'2027-01-06';
  if(p.season==='fall')   return na?'2027-08-18':h.region==='europe'?'2027-08-28':jp?'2027-09-15':'2027-08-01';
  if(p.season==='summer') return na?'2027-06-19':h.region==='europe'?'2027-07-03':'2027-06-26';
  return h.region==='asia'?'2026-12-27':'2027-01-02';
}

function stayImpact(h,d){
  const cc=h.cc;
  if(h.region==='us') return 'Your F-1 status covers the program dates on your I-20.';
  if(h.cc==='CA') return d>182?'Over 6 months: you need a study permit, plus an eTA.':'6 months or less: an eTA is enough. No study permit needed.';
  if(cc==='GB') return d>183?'Over 6 months: you need a UK Student visa.':'Up to 6 months: study as a Standard Visitor with an ETA.';
  if(cc==='CN') return d>180?'Over 180 days: X1 visa, then a residence permit.':'180 days or less: X2 visa.';
  if(cc==='HK') return d>180?'Over 180 days: student visa, plus a Hong Kong ID card.':'Student visa (entry permit) through your host.';
  if(cc==='SG') return "Student's Pass needed for study, whatever the length.";
  if(SCHENGEN.has(cc)) return d>90?'Over 90 days: national long-stay visa or residence permit.':'Up to 90 days: visa-free in the Schengen area.';
  if(cc==='AU') return d>92?'Over 3 months: you need a Student visa (subclass 500) and OSHC insurance.':'Up to 3 months: you can study on an ETA (subclass 601).';
  if(cc==='JP'||cc==='TW') return d>90?'Over 90 days: student visa needed.':'Up to 90 days: visa-free for Korean passports.';
  return d>90?'Over 90 days: a student visa is likely needed.':'Up to 90 days: often visa-free. Check the embassy rules.';
}

function pagesOf(h){

  const office=P.exch||P.intl, site=h.url||'';

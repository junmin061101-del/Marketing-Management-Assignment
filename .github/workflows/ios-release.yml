name: iOS build → App Store Connect

# Builds the iPhone app on a GitHub-hosted Mac and uploads it to App Store Connect (TestFlight),
# so no Mac of our own is needed. Run it from the Actions tab → "iOS build → App Store Connect" → Run workflow.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com → Membership details)
#   ASC_KEY_ID      App Store Connect API key ID          (App Store Connect → Users and Access → Integrations)
#   ASC_ISSUER_ID   Issuer ID shown above the key list
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_XXXX.p8 file
# Signing is automatic: Xcode creates the certificate and the App Store profile through the API key.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave empty to use the run number)'
        required: false

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$T" ] || missing="$missing APPLE_TEAM_ID"; [ -n "$K" ] || missing="$missing ASC_KEY_ID"
          [ -n "$I" ] || missing="$missing ASC_ISSUER_ID"; [ -n "$P" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Copy the web app into the iOS project
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: App Store Connect API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Archive
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_ENTITLEMENTS=App/App.entitlements \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tail -n 200

      - name: Upload to App Store Connect
        working-directory: mobile/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          echo "Uploaded build $BUILD_NUMBER (version 1.0.0). It appears in App Store Connect → TestFlight after Apple processes it (about 10–30 minutes)."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
